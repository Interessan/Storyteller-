<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aventura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module">
  import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
  env.allowLocalModels = false;
  env.useBrowserCache = true;
  window._transformers = { pipeline, env };
  window.dispatchEvent(new Event('transformers-ready'));
</script>

<style>
  :root{
    --ink: #141416;
    --panel: #1e1e22;
    --panel-2: #26262b;
    --border: rgba(255,255,255,0.10);
    --border-soft: rgba(255,255,255,0.06);
    --muted: #9a9aa2;
    --text: #f0eee8;
    --text-dim: #ccc9c1;
    --text-alt: #b0ada3;
    --accent: #efece4;
    --accent-ink: #0e0e10;
    --danger: #c96a5c;
    --shadow: rgba(0,0,0,0.55);
    --scenario-accent: #d4a960;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0; overflow-x:hidden; height:100%;}
  input, textarea, select{ max-width:100%; min-width:0; }
  #app{
    font-family:'Newsreader', 'Georgia', serif;
    font-size:17px;
    background:
      radial-gradient(ellipse 1200px 700px at 20% -10%, rgba(255,255,255,0.045), transparent 55%),
      radial-gradient(ellipse 900px 600px at 100% 100%, rgba(255,255,255,0.025), transparent 55%),
      var(--ink);
    color: var(--text);
    height:100vh;
    height:100dvh;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'Inter', system-ui, sans-serif; font-size:11px; letter-spacing:.02em;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px;
    background: linear-gradient(180deg, rgba(20,20,22,0.92), rgba(20,20,22,0));
    position:sticky; top:0; z-index:20;
  }
  header .titlewrap{display:flex; align-items:baseline; gap:10px; min-width:0;}
  header h1{
    font-family:'Newsreader', serif; font-weight:500; font-size:19px; margin:0;
    color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header .tag{
    font-family:'Inter', system-ui, sans-serif; font-size:10.5px; color:var(--muted);
    letter-spacing:.09em; text-transform:uppercase; flex-shrink:0;
  }
  header .btns{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; row-gap:6px;}
  button{
    font-family:'Inter', system-ui, sans-serif; font-size:12.5px; font-weight:500;
    background: rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--border);
    padding:9px 15px; border-radius:999px; cursor:pointer; letter-spacing:.01em;
    backdrop-filter: blur(10px);
    transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover{ background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.18); }
  button:active{ transform: scale(0.97); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button.primary{
    background: var(--accent); color: var(--accent-ink); border:1px solid var(--accent); font-weight:600;
  }
  button.primary:hover{ background:#fff; border-color:#fff; }
  button.danger{ color:#f0c9c2; border-color: rgba(201,106,92,0.4); background:rgba(201,106,92,0.1); }
  button.danger:hover{ background:rgba(201,106,92,0.18); }
  button.ghost{ background:transparent; border-color:transparent; }
  button.ghost:hover{ background:rgba(255,255,255,0.07); }
  button:disabled{ opacity:.4; cursor:default; }
  button.icon{ padding:9px 12px; border-radius:999px; }
  button.scenario-btn{ color: var(--scenario-accent); border-color: rgba(212,169,96,0.35); background: rgba(212,169,96,0.08); }
  button.scenario-btn:hover{ background: rgba(212,169,96,0.15); border-color: rgba(212,169,96,0.5); }

  .layout{
    display:grid;
    grid-template-columns: 1fr 46px;
    flex:1;
    min-height:0;
    max-width:1500px;
    width:100%;
    margin:0 auto;
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; max-width:none; }
    .spine{ display:none; }
  }
  #app.force-mobile .layout{ grid-template-columns: 1fr !important; max-width:none !important; }
  #app.force-mobile .spine{ display:none !important; }
  #app.force-mobile .page{ max-width:100% !important; }
  #app.force-desktop .layout{ grid-template-columns: 1fr 46px !important; max-width:1500px !important; }
  #app.force-desktop .spine{ display:flex !important; }
  .layout-toggle{ font-size:10px !important; padding:7px 10px !important; }

  .layout > *{ min-width:0; }
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .memory-panel{
    position:fixed; top:0; left:0; height:100vh; width:360px; max-width:90vw;
    background: var(--panel);
    border-right:1px solid var(--border-soft);
    padding:18px;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex; flex-direction:column; gap:12px;
    z-index:41;
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 20px 0 60px var(--shadow);
  }
  .memory-panel.open{ transform:translateX(0); }
  .memory-panel.scenario-mode{
    border-right-color: rgba(212,169,96,0.35);
  }
  .memory-panel-close{ align-self:flex-end; }
  .memory-panel h2{
    font-family:'Newsreader', serif; font-weight:500; font-size:17px; color:var(--text);
    margin:0 0 6px; display:flex; align-items:center; gap:7px; user-select:none;
    border-bottom:1px solid var(--border-soft); padding-bottom:8px;
  }

  .scenario-banner{
    background: linear-gradient(90deg, rgba(212,169,96,0.18), rgba(212,169,96,0.08));
    border: 1px solid rgba(212,169,96,0.4);
    border-radius: 12px;
    padding: 10px 12px;
    margin: 0 0 6px;
  }
  .scenario-banner .sb-label{
    font-family:'Inter', sans-serif; font-size:10px; color: var(--scenario-accent);
    letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; font-weight:600;
  }
  .scenario-banner .sb-title{
    font-family:'Newsreader', serif; font-size:15px; color:var(--text); margin-bottom:2px;
  }
  .scenario-banner .sb-desc{
    font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); line-height:1.4;
  }
  .scenario-banner .sb-actions{ display:flex; gap:6px; margin-top:8px; }
  .scenario-banner .sb-actions button{ font-size:11px; padding:6px 11px; }

  .mem-tabs{
    display:flex; gap:4px; padding-bottom:10px; margin-bottom:2px;
    border-bottom:1px solid var(--border-soft);
  }
  .mem-tab{
    flex:1; padding:9px 0; font-size:16px; line-height:1;
    background:transparent; border:1px solid transparent; border-radius:10px;
    cursor:pointer; color:var(--muted);
    transition: background .15s, color .15s, border-color .15s;
    font-family:'Inter', sans-serif;
  }
  .mem-tab:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  .mem-tab.active{
    background:rgba(255,255,255,0.12); border-color:var(--border); color:var(--text);
  }
  .memory-panel.scenario-mode .mem-tab.active{
    background: rgba(212,169,96,0.16); border-color: rgba(212,169,96,0.35); color: var(--text);
  }

  .field label{
    display:block; font-family:'Inter', system-ui, sans-serif; font-size:11.5px; color:var(--muted);
    margin-bottom:6px; letter-spacing:.04em; text-transform:uppercase;
  }
  .field textarea, .field input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'Newsreader', serif; font-size:15.5px; line-height:1.55; padding:11px 12px; resize:vertical;
  }
  .field textarea{ min-height:110px; }
  .field textarea:focus, .field input:focus{ outline:none; border-color: rgba(255,255,255,0.28); }
  .memory-panel.scenario-mode .field textarea:focus,
  .memory-panel.scenario-mode .field input:focus{
    border-color: rgba(212,169,96,0.5);
  }
  .field{ margin-bottom:12px; }
  .summ-note{ font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); line-height:1.5; }
  .nudge-banner{
    background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-family:'Inter', sans-serif; font-size:12.5px; color:var(--text-dim); line-height:1.5; margin-bottom:8px;
  }
  .nudge-banner button{ font-size:11px; padding:6px 11px; }
  .summ-note.err{ color:#f0c9c2; }

  .memory-panel.scenario-mode #scenarioOpening {
    min-height: 150px;
    border-color: rgba(212,169,96,0.35);
    background: rgba(212,169,96,0.04);
  }
  .memory-panel.scenario-mode #scenarioOpening:focus {
    border-color: rgba(212,169,96,0.7);
    background: rgba(212,169,96,0.07);
  }
  .opening-label-wrap{
    display:flex; align-items:center; gap:6px; margin-bottom:6px;
  }
  .opening-label-wrap .opening-icon{
    font-size: 13px;
  }

  .lang-options{ display:flex; flex-direction:column; gap:5px; margin-bottom:8px; }
  .lang-option{
    display:flex; align-items:flex-start; gap:8px; padding:9px 11px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    cursor:pointer; transition: background .12s, border-color .12s;
    user-select:none;
  }
  .lang-option:hover{ background:rgba(255,255,255,0.06); }
  .lang-option.selected{ background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); }
  .memory-panel.scenario-mode .lang-option.selected{
    background: rgba(212,169,96,0.12); border-color: rgba(212,169,96,0.35);
  }
  .lang-option input[type=radio]{ margin:2px 0 0; accent-color: var(--accent); flex-shrink:0; }
  .lang-option .lo-body{ flex:1; min-width:0; }
  .lang-option .lo-title{ font-family:'Inter', sans-serif; font-size:13px; color:var(--text); margin-bottom:2px; font-weight:500; }
  .lang-option .lo-desc{ font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); line-height:1.4; }

  .pending-summary{
    background: rgba(239,236,228,0.06);
    border: 1px solid rgba(239,236,228,0.22);
    border-radius: 12px;
    padding: 12px 13px;
    margin-bottom: 12px;
  }
  .pending-summary .pending-title{
    font-family:'Inter', system-ui, sans-serif; font-size:10.5px; color:var(--accent);
    letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px;
  }
  .pending-summary textarea{
    width:100%; background:rgba(20,20,22,0.7); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-family:'Newsreader', serif;
    font-size:15px; line-height:1.6; padding:11px 12px; resize:vertical; min-height:100px;
  }
  .pending-summary textarea:focus{ outline:none; border-color:rgba(255,255,255,0.3); }
  .pending-actions{ display:flex; gap:6px; margin-top:8px; }

  .updates-panel{
    max-width:740px; margin:0 auto 10px;
    background: rgba(239,236,228,0.06);
    border: 1px solid rgba(239,236,228,0.22);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .updates-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .updates-title{
    font-family:'Inter', sans-serif; font-size:11px; color:var(--accent);
    letter-spacing:.05em; text-transform:uppercase;
  }
  .updates-head button{ padding:5px 10px; font-size:11px; }
  .updates-list{ display:flex; flex-direction:column; gap:8px; }
  .update-item{
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px;
  }
  .update-card-name{
    font-family:'Inter', sans-serif; font-size:10.5px; color:var(--accent);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;
  }
  .update-diff{
    display:flex; flex-direction:column; gap:4px; margin-bottom:8px;
    font-family:'Newsreader', serif; font-size:13.5px; line-height:1.5;
  }
  .update-old{
    color:var(--muted); text-decoration:line-through; opacity:.75;
    font-size:12.5px;
  }
  .update-old-empty{ color:var(--muted); font-style:italic; font-size:12.5px; }
  .update-new-input{
    background:var(--ink); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:'Newsreader', serif; font-size:14px;
    padding:7px 10px; resize:vertical; width:100%;
    min-height:38px; line-height:1.5;
  }
  .update-new-input:focus{ outline:none; border-color:rgba(255,255,255,0.28); }
  .update-actions{ display:flex; gap:5px; }
  .update-actions button{ padding:5px 12px; font-size:11px; }
  .updates-foot{
    display:flex; gap:6px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border-soft);
  }
  .updates-foot button{ flex:1; font-size:11.5px; padding:8px 12px; }

  .card-preview{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 13px;
    margin-bottom:7px;
    cursor:pointer;
    transition: background .15s, border-color .15s, transform .08s;
    user-select:none;
  }
  .card-preview:hover{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.2);
  }
  .card-preview:active{ transform:scale(0.995); }
  .card-preview-head{
    display:flex; align-items:center; gap:8px; margin-bottom:5px;
  }
  .card-preview-name{
    font-family:'Newsreader', serif; font-size:16px; font-weight:500;
    color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    min-width:0;
  }
  .card-preview-body{
    font-family:'Newsreader', serif; font-size:14px; line-height:1.5;
    color:var(--muted);
    display:-webkit-box;
    -webkit-line-clamp:2;
    line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-preview-empty{ font-style:italic; opacity:.55; }
  .card-preview-actions{ display:flex; gap:2px; flex-shrink:0; }
  .card-preview-action{
    padding:4px 8px !important; font-size:11px !important;
    opacity:.45;
    background:transparent !important;
    border-color:transparent !important;
    backdrop-filter:none !important;
  }
  .card-preview-action:hover{ opacity:1; background:rgba(255,255,255,0.08) !important; }
  .card-preview-del:hover{ color:#f0c9c2 !important; }

  .status-pill{
    display:inline-block; padding:2px 7px; border-radius:999px;
    font-family:'Inter', sans-serif; font-size:10px; font-weight:500;
    letter-spacing:.03em; margin-left:4px; vertical-align:middle;
  }
  .status-vivo{ background:rgba(120,180,120,0.2); color:#b8d8b8; border:1px solid rgba(120,180,120,0.35); }
  .status-morto{ background:rgba(201,106,92,0.2); color:#f0c9c2; border:1px solid rgba(201,106,92,0.4); }
  .status-desaparecido{ background:rgba(200,180,120,0.18); color:#e0d8b0; border:1px solid rgba(200,180,120,0.35); }
  .status-desconhecido{ background:rgba(150,150,150,0.15); color:var(--muted); border:1px solid rgba(150,150,150,0.3); }

  main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
  .feed{ flex:1; overflow-y:auto; padding:34px 26px 40px; }
  .page{
    max-width:740px; margin:0 auto 14px; color:var(--text);
    padding:0; font-size:17.5px; line-height:1.9;
    font-family:'Newsreader', serif; font-weight:400;
    white-space: pre-wrap;
  }
  .turn{ position:relative; display:inline; }
  .turn.user{ font-style:italic; color:var(--text-dim); }
  .turn.ai{ cursor:pointer; color:var(--text); }
  .turn.ai.ai-alt{ color:var(--text-alt); }
  .turn.user{ cursor:pointer; }
  .turn.archived{ opacity:.38; }
  .turn.active-menu{ background:rgba(255,255,255,0.08); border-radius:3px; box-shadow:0 0 0 4px rgba(255,255,255,0.08); }
  .turn .actions{
    display:inline-flex; gap:5px; margin-left:6px; vertical-align:middle; cursor:default;
  }
  .turn .actions.actions-open{
    background:rgba(255,255,255,0.06); border-radius:999px; padding:3px 6px;
  }
  .turn .actions button{
    padding:4px 9px; font-size:10.5px; background:rgba(255,255,255,0.06); color:var(--text-dim);
    border:1px solid var(--border); border-radius:999px; white-space:nowrap; cursor:pointer;
    font-family:'Inter', sans-serif; backdrop-filter:none;
  }
  .turn .actions button:hover{ background:rgba(255,255,255,0.14); }
  .turn-editbox{
    display:block; width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:'Newsreader', serif; font-size:17.5px; line-height:1.85; padding:10px 12px;
    resize:vertical; margin:6px 0; min-height:60px; overflow:hidden;
  }
  .turn-editbox:focus{ outline:none; border-color: rgba(255,255,255,0.28); }
  .empty-state{ max-width:520px; margin:80px auto; text-align:center; color:var(--muted); }
  .empty-state h2{ font-family:'Newsreader', serif; font-weight:500; font-size:23px; color:var(--text); }

  .composer{
    padding:16px 26px 20px; background: linear-gradient(0deg, rgba(20,20,22,0.96), rgba(20,20,22,0));
  }
  .composer-inner{ max-width:740px; margin:0 auto; }
  .composer textarea{
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    color:var(--text); font-family:'Newsreader', serif; font-size:16px; padding:13px 15px; resize:none;
    min-height:52px;
  }
  .composer textarea:focus{ outline:none; border-color: rgba(255,255,255,0.28); }
  .composer-row{ display:flex; gap:8px; margin-top:9px; align-items:center; }
  .token-estimate{ font-size:10.5px; color:var(--muted); margin-top:5px; opacity:.8; }
  .dungeon-bar{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:10px; }
  .dungeon-bar button{ padding:10px 15px; font-size:12.5px; white-space:nowrap; }
  .dungeon-bar-secondary{ margin-top:6px; }
  .dungeon-bar-secondary button{ padding:7px 12px; font-size:11.5px; opacity:.85; }
  .retry-group{
    display:flex; align-items:center; gap:0;
    background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:999px;
  }
  .retry-group button{ border:none; border-radius:999px; background:transparent; white-space:nowrap; }
  .retry-nav{ padding:10px 12px !important; }
  .retry-count{ padding:0 8px; font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); white-space:nowrap; }
  .dungeon-bar-main{ display:flex; gap:7px; }
  .dungeon-bar-main > button{ flex:1 1 0; }
  .dungeon-bar-main > .retry-group{ flex:1.4 1 0; justify-content:center; }
  .dungeon-bar-secondary button{ flex:0 0 auto; }
  .retry-guidance{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .retry-guidance input{
    flex:1; min-width:140px; background:var(--panel); border:1px solid var(--border); border-radius:999px;
    color:var(--text); font-family:'Newsreader', serif; font-size:15px; padding:10px 14px;
  }
  .retry-guidance input:focus{ outline:none; border-color: rgba(255,255,255,0.28); }
  @media (max-width: 480px){
    .dungeon-bar button{ padding:10px 10px; font-size:11.5px; }
    .retry-group{ display:flex; }
    .retry-group button{ flex:1 1 auto; padding-left:8px !important; padding-right:8px !important; }
    .dungeon-bar-secondary{ flex-wrap:wrap; }
    .dungeon-bar-secondary button{ font-size:10.5px; padding:7px 10px; }
  }
  .composer-row .spacer{ flex:1; }
  .status{ font-family:'Inter', sans-serif; font-size:11.5px; color:var(--muted); }
  .status.err{ color:#f0c9c2; }
  .save-warning{ font-family:'Inter', sans-serif; font-size:11px; color:#f0c9c2; margin-right:6px; }

  .spine{
    background:transparent; border-left:1px solid var(--border-soft);
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 0; overflow-y:auto;
  }
  .spine .tab{
    width:26px; height:20px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid var(--border);
    color:var(--muted); font-family:'Inter', sans-serif; font-size:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .spine .tab.ai{ border-color: rgba(255,255,255,0.2); }
  .spine .tab.current{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }

<body>
<div id="app"></div>

<script>
(function(){

  function backend(){
    if (state.drive && state.drive.signedIn) return 'drive';
    if (typeof window.storage !== 'undefined' && window.storage) return 'native';
    return 'local';
  }

  async function sGet(key){
    const b = backend();
    if (b === 'native'){
      try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if (b === 'drive'){
      await ensureDriveLoaded();
      return (key in state.drive.store) ? state.drive.store[key] : null;
    }
    try{
      const raw = localStorage.getItem('aventura:' + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  async function sSet(key, val, attempt){
    const b = backend();
    attempt = attempt || 0;
    if (b === 'native'){
      try{
        await window.storage.set(key, JSON.stringify(val), false);
        return true;
      }catch(e){
        if (attempt < 2){
          await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
          return sSet(key, val, attempt + 1);
        }
        console.error('storage set failed after retries', e);
        return false;
      }
    }
    if (b === 'drive'){
      await ensureDriveLoaded();
      state.drive.store[key] = val;
      scheduleDriveUpload();
      return true;
    }
    try{ localStorage.setItem('aventura:' + key, JSON.stringify(val)); return true; }
    catch(e){ console.error('localStorage set failed', e); return false; }
  }

  async function sDelete(key){
    const b = backend();
    if (b === 'native'){ try{ await window.storage.delete(key, false); }catch(e){} return; }
    if (b === 'drive'){ await ensureDriveLoaded(); delete state.drive.store[key]; scheduleDriveUpload(); return; }
    try{ localStorage.removeItem('aventura:' + key); }catch(e){}
  }

  function loadSavedClientId(){
    try{ return localStorage.getItem('aventura:googleClientId') || ''; }catch(e){ return ''; }
  }
  function saveClientId(id){
    try{ localStorage.setItem('aventura:googleClientId', id); }catch(e){}
  }

  async function driveFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + state.drive.token }, opts.headers || {});
    const res = await fetch(url, opts);
    if (res.status === 401){
      state.drive.signedIn = false;
      state.drive.loaded = false;
      updateStatus('Sua sessão do Google expirou — clique em "Entrar com Google" de novo nas Configurações.', true);
      render();
      throw new Error('Sessão do Google expirada.');
    }
    return res;
  }

  async function driveFindFile(){
    const q = encodeURIComponent("name='aventura-store.json'");
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name)');
    if (!res.ok) throw new Error('Falha ao procurar dados no Drive (' + res.status + ')');
    const data = await res.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }

  async function driveCreateFile(initialContent){
    const boundary = 'aventura_boundary_' + uid();
    const metadata = { name: 'aventura-store.json', parents: ['appDataFolder'] };
    const body =
      '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(initialContent) + '\r\n' +
      '--' + boundary + '--';
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) throw new Error('Falha ao criar dados no Drive (' + res.status + ')');
    const data = await res.json();
    return data.id;
  }

  async function driveReadFile(fileId){
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    if (!res.ok) throw new Error('Falha ao ler dados do Drive (' + res.status + ')');
    const text = await res.text();
    try{ return text ? JSON.parse(text) : {}; }catch(e){ return {}; }
  }

  async function driveWriteFile(fileId, content){
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method:'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(content)
    });
    if (!res.ok) throw new Error('Falha ao salvar no Drive (' + res.status + ')');
  }

  let driveLoadingPromise = null;
  async function ensureDriveLoaded(){
    if (state.drive.loaded) return;
    if (driveLoadingPromise) return driveLoadingPromise;
    driveLoadingPromise = (async () => {
      let fileId = await driveFindFile();
      if (!fileId){
        fileId = await driveCreateFile({});
        state.drive.store = {};
      } else {
        state.drive.store = await driveReadFile(fileId);
      }
      state.drive.fileId = fileId;
      state.drive.loaded = true;
    })();
    try{ await driveLoadingPromise; } finally { driveLoadingPromise = null; }
  }

  let driveUploadTimer = null;
  function scheduleDriveUpload(){
    clearTimeout(driveUploadTimer);
    driveUploadTimer = setTimeout(async () => {
      try{ await driveWriteFile(state.drive.fileId, state.drive.store); }
      catch(e){ console.error('drive upload failed', e); showSaveWarning(); }
    }, 500);
  }

  // Faz merge: copia do localStorage pro Drive as chaves que NÃO existem no Drive.
  // Nunca sobrescreve o que já está no Drive.
  async function migrateLocalToDriveIfEmpty(){
    const store = state.drive.store || {};
    const SKIP = new Set(['googleClientId', 'forcedLayout', 'driveWasSignedIn']);
    const migratedKeys = [];
    try{
      for (let i = 0; i < localStorage.length; i++){
        const fullKey = localStorage.key(i);
        if (!fullKey || !fullKey.startsWith('aventura:')) continue;
        const shortKey = fullKey.slice('aventura:'.length);
        if (SKIP.has(shortKey)) continue;
        if (shortKey.startsWith('vectorSync:')) continue;
        if (shortKey in store) continue; // já existe no Drive, não sobrescreve
        try{
          store[shortKey] = JSON.parse(localStorage.getItem(fullKey));
          migratedKeys.push(shortKey);
        }catch(e){ /* ignora entradas corrompidas */ }
      }
    }catch(e){
      console.warn('Migration: erro lendo localStorage', e);
      return;
    }

    if (!migratedKeys.length) return;

    // Usa scheduleDriveUpload (respeita debounce; não sobrescreve writes concorrentes)
    scheduleDriveUpload();
    updateStatus('Dados locais mesclados ao Drive ✓ (' + migratedKeys.length + ' item' + (migratedKeys.length > 1 ? 's' : '') + ')', false);
  }

  function initGoogleTokenClient(){
    if (!state.drive.clientId || typeof google === 'undefined' || !google.accounts) return;
    state.drive.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.drive.clientId,
      scope: 'https://www.googleapis.com/auth/drive.appdata',
      callback: async (resp) => {
        if (resp.error){
          if (!state.drive.signedIn) return;
          updateStatus('Erro ao entrar com Google: ' + resp.error, true); render(); return;
        }
        state.drive.token = resp.access_token;
        state.drive.tokenExpiry = Date.now() + (resp.expires_in || 3500) * 1000;
        state.drive.signedIn = true;
        state.drive.loaded = false;
        try{ localStorage.setItem('aventura:driveWasSignedIn', '1'); }catch(e){}
        updateStatus('Conectando ao Google Drive…', false);
        render();
        try{
          await ensureDriveLoaded();
          await migrateLocalToDriveIfEmpty();
          await init();
          updateStatus('Conectado ao Google Drive ✓ — os dados agora sincronizam por essa conta.', false);
          if (state.story) syncVectorsWithDrive(state.story.id).catch(() => {});
        }catch(err){
          updateStatus('Erro ao carregar dados do Drive: ' + err.message, true);
        }
        render();
      }
    });
  }

  function signInWithGoogle(){
    const idInput = document.getElementById('googleClientId');
    const clientId = (idInput ? idInput.value.trim() : state.drive.clientId);
    if (!clientId){ updateStatus('Cole o Client ID do Google antes de entrar.', true); render(); return; }
    state.drive.clientId = clientId;
    saveClientId(clientId);
    if (!state.drive.tokenClient) initGoogleTokenClient();
    if (state.drive.tokenClient) state.drive.tokenClient.requestAccessToken();
    else updateStatus('A biblioteca do Google ainda não carregou — espera um segundo e tenta de novo.', true);
    render();
  }

  async function signOutGoogle(){
    state.drive.signedIn = false;
    state.drive.token = null;
    state.drive.loaded = false;
    state.drive.store = {};
    try{ localStorage.removeItem('aventura:driveWasSignedIn'); }catch(e){}
    await init();
    render();
  }

  function attemptSilentGoogleSignIn(){
    let wasSignedIn = false;
    try{ wasSignedIn = localStorage.getItem('aventura:driveWasSignedIn') === '1'; }catch(e){}
    if (!wasSignedIn || !state.drive.clientId) return;
    let tries = 0;
    const poll = setInterval(() => {
      tries++;
      if (typeof google !== 'undefined' && google.accounts){
        clearInterval(poll);
        initGoogleTokenClient();
        if (state.drive.tokenClient){
          try{ state.drive.tokenClient.requestAccessToken({ prompt: '' }); }catch(e){}
        }
      } else if (tries > 20){
        clearInterval(poll);
      }
    }, 250);
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  let state = {
    index: [],
    story: null,
    scenarioIndex: [],
    scenario: null,
    connector: null,
    drive: {
      clientId: loadSavedClientId(),
      tokenClient: null,
      token: null,
      tokenExpiry: 0,
      signedIn: false,
      fileId: null,
      store: {},
      loaded: false
    },
    ui: {
      modal: null,
      generating: false,
      statusMsg: '',
      statusErr: false,
      saveWarning: false,
      composerText: '',
      memoryPanelOpen: false,

  function estimateTokens(str){
    return Math.ceil((str || '').length / 3.2);

  function selectTurnsByBudget(turns, budgetTokens, maxCount){
    const selected = [];
    let total = 0;
    for (let i = turns.length - 1; i >= 0 && selected.length < maxCount; i--){
      const t = turns[i];
      const cost = estimateTokens(t.text);
      if (selected.length > 0 && total + cost > budgetTokens) break;
      selected.unshift(t);
      total += cost;
    }
    return selected;
  }

  let _embedder = null;
  let _embedderPromise = null;
  let _vectorDb = null;
  const VECTOR_DB_NAME = 'aventura-vectors';
  const VECTOR_DB_VERSION = 1;
  const VECTOR_STORE = 'embeddings';
  const EMBEDDING_MODEL = 'Xenova/all-MiniLM-L6-v2';
  const VECTOR_SCORE_THRESHOLD = 0.35;
  const VECTOR_TOP_K = 5;
  const VECTOR_DRIVE_VERSION = 1;
  const VECTOR_DRIVE_PREFIX = 'aventura-vectors-';

  const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                         || (navigator.maxTouchPoints > 0 && window.innerWidth < 900);

  let _vectorUploadTimer = null;
  let _vectorUploadPending = false;

  async function waitForTransformers(timeout = 20000){
    if (window._transformers) return window._transformers;
    return new Promise(resolve => {
      const start = Date.now();
      const check = () => {
        if (window._transformers) return resolve(window._transformers);
        if (Date.now() - start > timeout) return resolve(null);
        setTimeout(check, 150);
      };
      check();
    });
  }

  async function initEmbedder(){
    if (_embedder) return _embedder;
    if (_embedderPromise) return _embedderPromise;
    _embedderPromise = (async () => {
      state.ui.vectorLoading = true;
      state.ui.vectorError = null;
      try{
        const tr = await waitForTransformers();
        if (!tr || !tr.pipeline){
          throw new Error('Transformers.js não carregou (verifique a conexão).');
        }
        let pipe = null;
        let lastErr = null;
        const attempts = isMobileDevice ? ['wasm'] : ['webgl', 'wasm'];
        for (const device of attempts){
          try{
            pipe = await tr.pipeline('feature-extraction', EMBEDDING_MODEL, { device });
            break;
          }catch(e){
            lastErr = e;
            console.warn('Falha ao inicializar com device ' + device + ':', e.message);
            await new Promise(r => setTimeout(r, 500));
          }
        }
        if (!pipe){
          throw new Error('Modelo não iniciou (tentei: ' + attempts.join(', ') + '). Último erro: ' + (lastErr ? lastErr.message : 'desconhecido'));
        }
        _embedder = pipe;
        state.ui.vectorReady = true;
        state.ui.vectorLoading = false;
        state.ui.vectorError = null;
        return _embedder;
      }catch(err){
        state.ui.vectorLoading = false;
        state.ui.vectorError = err.message || String(err);
        _embedderPromise = null;
        throw err;
      }
    })();
    return _embedderPromise;
  }

  async function openVectorDb(){
    if (_vectorDb) return _vectorDb;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(VECTOR_DB_NAME, VECTOR_DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(VECTOR_STORE)){
          const store = db.createObjectStore(VECTOR_STORE, { keyPath: 'turnId' });
          store.createIndex('type', 'type', { unique: false });
          store.createIndex('storyId', 'storyId', { unique: false });
        }
      };
      req.onsuccess = () => { _vectorDb = req.result; resolve(_vectorDb); };
      req.onerror = () => reject(req.error);
    });
  }

  async function embedText(text){
    const embedder = await initEmbedder();
    const out = await embedder(text, { pooling: 'mean', normalize: true });
    return Array.from(out.data);
  }

  function textHash(str){
    let h = 0;
    for (let i = 0; i < str.length; i++){
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return (h >>> 0).toString(36);
  }

  function encodeVector(arr){
    const f32 = new Float32Array(arr);
    const bytes = new Uint8Array(f32.buffer);
    let bin = '';
    const chunk = 8192;
    for (let i = 0; i < bytes.length; i += chunk){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function decodeVector(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const f32 = new Float32Array(bytes.buffer);
    return Array.from(f32);
  }

  async function saveTurnVector(turn){
    if (!turn || !turn.text || turn.text.trim().length < 3) return;
    try{
      const vector = await embedText(turn.text);
      const db = await openVectorDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(VECTOR_STORE, 'readwrite');
        tx.objectStore(VECTOR_STORE).put({
          turnId: turn.id,
          storyId: state.story ? state.story.id : null,
          type: turn.type,
          text: turn.text,
          hash: textHash(turn.text),
          archived: !!turn.archived,
          vector,
          updatedAt: Date.now()
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      scheduleVectorDriveUpload();
    }catch(e){
      console.warn('saveTurnVector failed:', e);
    }
  }

  async function removeTurnVector(turnId){
    try{
      const db = await openVectorDb();
      await new Promise((resolve) => {
        const tx = db.transaction(VECTOR_STORE, 'readwrite');
        tx.objectStore(VECTOR_STORE).delete(turnId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
      scheduleVectorDriveUpload();
    }catch(e){ /* silencioso */ }
  }

  async function updateVectorArchived(turnId, archived){
    try{
      const db = await openVectorDb();
      await new Promise((resolve) => {
        const tx = db.transaction(VECTOR_STORE, 'readwrite');
        const store = tx.objectStore(VECTOR_STORE);
        const getReq = store.get(turnId);
        getReq.onsuccess = () => {
          const item = getReq.result;
          if (item){
            item.archived = !!archived;
            item.updatedAt = Date.now();
            store.put(item);
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }catch(e){ /* silencioso */ }
  }

  function cosineSimilarity(a, b){
    if (!a || !b || a.length !== b.length) return 0;
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++){
      dot += a[i] * b[i];
      na += a[i] * a[i];
      nb += b[i] * b[i];
    }
    if (na === 0 || nb === 0) return 0;
    return dot / (Math.sqrt(na) * Math.sqrt(nb));
  }

  async function searchRelevantTurns(queryText, opts){
    opts = opts || {};
    if (!_embedder) return [];
    if (!queryText || queryText.trim().length < 3) return [];
    const topK = opts.topK || VECTOR_TOP_K;
    const threshold = (typeof opts.threshold === 'number') ? opts.threshold : VECTOR_SCORE_THRESHOLD;
    try{
      const queryVector = await embedText(queryText);
      const db = await openVectorDb();
      const storyId = state.story ? state.story.id : null;
      return new Promise((resolve) => {
        const tx = db.transaction(VECTOR_STORE, 'readonly');
        const store = tx.objectStore(VECTOR_STORE);
        const req = store.getAll();
        req.onsuccess = () => {
          const all = req.result || [];
          const filtered = all.filter(item => !storyId || item.storyId === storyId);
          const scored = filtered
            .map(item => {
              let text = item.text;
              if (!text && state.story){
                const t = state.story.turns.find(x => x.id === item.turnId);
                if (t) text = t.text;
              }
              return {
                turnId: item.turnId,
                type: item.type,
                text: text || '',
                archived: !!item.archived,
                score: cosineSimilarity(queryVector, item.vector)
              };
            })
            .filter(item => item.score > threshold && item.text && !item.archived)
            .sort((a, b) => b.score - a.score)
            .slice(0, topK);
          resolve(scored);
        };
        req.onerror = () => resolve([]);
      });
    }catch(e){
      console.warn('searchRelevantTurns failed:', e);
      return [];
    }
  }

  async function driveFindVectorFile(storyId){
    const name = VECTOR_DRIVE_PREFIX + storyId + '.json';
    const q = encodeURIComponent("name='" + name + "'");
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name,modifiedTime)');
    if (!res.ok) throw new Error('Falha ao procurar vetores no Drive (' + res.status + ')');
    const data = await res.json();
    return (data.files && data.files[0]) ? data.files[0] : null;
  }

  async function driveCreateVectorFile(storyId, initialContent){
    const name = VECTOR_DRIVE_PREFIX + storyId + '.json';
    const boundary = 'aventura_vec_' + uid();
    const metadata = { name, parents: ['appDataFolder'] };
    const body =
      '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(initialContent) + '\r\n' +
      '--' + boundary + '--';
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) throw new Error('Falha ao criar vetores no Drive (' + res.status + ')');
    const data = await res.json();
    return data.id;
  }

  async function driveReadVectorFile(fileId){
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    if (!res.ok) throw new Error('Falha ao ler vetores do Drive (' + res.status + ')');
    const text = await res.text();
    try{ return text ? JSON.parse(text) : null; }catch(e){ return null; }
  }

  async function driveWriteVectorFile(fileId, content){
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method:'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(content)
    });
    if (!res.ok) throw new Error('Falha ao salvar vetores no Drive (' + res.status + ')');
  }

  async function uploadVectorsToDrive(){
    if (!state.drive.signedIn || !state.story) return;
    const storyId = state.story.id;
    try{
      state.ui.vectorDriveStatus = '⤴ enviando vetores…';
      render();

      const db = await openVectorDb();
      const items = await new Promise((resolve) => {
        const tx = db.transaction(VECTOR_STORE, 'readonly');
        const idx = tx.objectStore(VECTOR_STORE).index('storyId');
        const req = idx.getAll(storyId);
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });

      if (!items.length){
        state.ui.vectorDriveStatus = '';
        render();
        return;
      }

      const payload = {
        version: VECTOR_DRIVE_VERSION,
        model: EMBEDDING_MODEL,
        dim: items[0].vector.length,
        storyId,
        updatedAt: Date.now(),
        vectors: items.map(it => ({
          i: it.turnId,
          t: it.type,
          h: it.hash || textHash(it.text || ''),
          a: !!it.archived,
          text: (it.text || '').slice(0, 2500),
          v: encodeVector(it.vector)
        }))
      };

      let file = await driveFindVectorFile(storyId);
      let fileId;
      if (file){
        fileId = file.id;
        await driveWriteVectorFile(fileId, payload);
      } else {
        fileId = await driveCreateVectorFile(storyId, payload);
      }

      const meta = getSyncMeta(storyId);
      meta.lastPushedAt = Date.now();
      setSyncMeta(storyId, meta);

      state.ui.vectorDriveStatus = '✓ vetores salvos no Drive';
      render();
      setTimeout(() => {
        if (state.ui.vectorDriveStatus === '✓ vetores salvos no Drive'){
          state.ui.vectorDriveStatus = '';
          render();
        }
      }, 3000);
    }catch(err){
      console.warn('uploadVectorsToDrive failed:', err);
      state.ui.vectorDriveStatus = '⚠ falha ao enviar vetores';
      render();
      setTimeout(() => {
        state.ui.vectorDriveStatus = '';
        render();
      }, 5000);
    }
  }

  function scheduleVectorDriveUpload(){
    if (!state.drive.signedIn) return;
    _vectorUploadPending = true;
    clearTimeout(_vectorUploadTimer);
    _vectorUploadTimer = setTimeout(async () => {
      if (_vectorUploadPending){
        _vectorUploadPending = false;
        await uploadVectorsToDrive();
      }
    }, 30000);
  }

  async function downloadVectorsFromDrive(storyId){
    if (!state.drive.signedIn) return false;
    try{
      state.ui.vectorDriveStatus = '⤵ baixando vetores…';
      render();

      const file = await driveFindVectorFile(storyId);
      if (!file){
        state.ui.vectorDriveStatus = '';
        render();
        return false;
      }

      const payload = await driveReadVectorFile(file.id);
      if (!payload || payload.version !== VECTOR_DRIVE_VERSION){
        state.ui.vectorDriveStatus = '';
        render();
        return false;
      }
      if (payload.model !== EMBEDDING_MODEL){
        state.ui.vectorDriveStatus = '⚠ vetores antigos (modelo antigo) — regenerando';
        render();
        setTimeout(() => {
          state.ui.vectorDriveStatus = '';
          render();
        }, 5000);
        return false;
      }

      const meta = getSyncMeta(storyId);
      if (meta.lastPulledAt && payload.updatedAt && payload.updatedAt <= meta.lastPulledAt){
        state.ui.vectorDriveStatus = '';
        render();
        return false;
      }

      const db = await openVectorDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(VECTOR_STORE, 'readwrite');
        const store = tx.objectStore(VECTOR_STORE);
        payload.vectors.forEach(v => {
          store.put({
            turnId: v.i,
            storyId: payload.storyId,
            type: v.t,
            hash: v.h,
            archived: !!v.a,
            text: v.text || '',
            vector: decodeVector(v.v),
            updatedAt: Date.now()
          });
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });

      meta.lastPulledAt = Date.now();
      setSyncMeta(storyId, meta);

      state.ui.vectorCount = await countStoryVectors(storyId);
      state.ui.vectorDriveStatus = '✓ vetores sincronizados do Drive';
      render();
      setTimeout(() => {
        if (state.ui.vectorDriveStatus === '✓ vetores sincronizados do Drive'){
          state.ui.vectorDriveStatus = '';
          render();
        }
      }, 3000);
      return true;
    }catch(err){
      console.warn('downloadVectorsFromDrive failed:', err);
      state.ui.vectorDriveStatus = '⚠ falha ao baixar vetores';
      render();
      setTimeout(() => {
        state.ui.vectorDriveStatus = '';
        render();
      }, 5000);
      return false;
    }
  }

  async function syncVectorsWithDrive(storyId){
    if (!storyId) return;
    if (state.drive.signedIn){
      await downloadVectorsFromDrive(storyId);
    }
    await syncStoryVectors({ storyId });
  }

  async function syncStoryVectors(opts){
    opts = opts || {};
    const storyId = opts.storyId || (state.story ? state.story.id : null);
    if (!storyId) return;
    if (opts.storyId && state.story && opts.storyId !== state.story.id) return;
    const s = state.story;
    if (!s || s.id !== storyId) return;
    try{
      const db = await openVectorDb();
      const existingIds = await new Promise((resolve) => {
        const tx = db.transaction(VECTOR_STORE, 'readonly');
        const idx = tx.objectStore(VECTOR_STORE).index('storyId');
        const req = idx.getAll(storyId);
        req.onsuccess = () => resolve(new Set((req.result || []).map(it => it.turnId)));
        req.onerror = () => resolve(new Set());
      });

      const currentIds = new Set(s.turns.map(t => t.id));
      const toRemove = [];
      for (const id of existingIds){
        if (!currentIds.has(id)) toRemove.push(id);
      }
      if (toRemove.length){
        await new Promise((resolve) => {
          const tx = db.transaction(VECTOR_STORE, 'readwrite');
          const store = tx.objectStore(VECTOR_STORE);
          toRemove.forEach(id => store.delete(id));
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      }

      const missing = s.turns.filter(t => !existingIds.has(t.id));
      state.ui.vectorIndexing = missing.length;
      if (missing.length) render();

      for (let i = 0; i < missing.length; i++){
        await saveTurnVector(missing[i]);
        if (i % 5 === 0){
          state.ui.vectorIndexing = missing.length - i - 1;
          render();
          await new Promise(r => setTimeout(r, 0));
        }
      }

      state.ui.vectorIndexing = 0;
      state.ui.vectorCount = await countStoryVectors(storyId);
      render();
    }catch(e){
      console.warn('syncStoryVectors failed:', e);
      state.ui.vectorIndexing = 0;
    }
  }

  async function init(){
    state.index = (await sGet('stories:index')) || [];
    state.scenarioIndex = (await sGet('scenarios:index')) || [];
    state.connector = Object.assign(defaultConnector(), (await sGet('settings:connector')) || {});
    if (typeof state.connector.updatesTokenBudget !== 'number'){
      state.connector.updatesTokenBudget = 80;
    }
    if (typeof state.connector.colabEndpoint !== 'string') state.connector.colabEndpoint = '';
    if (typeof state.connector.colabModel !== 'string') state.connector.colabModel = 'local-model';
    if (typeof state.connector.colabKey !== 'string') state.connector.colabKey = '';
    if (state.connector.mode === 'builtin'){
      state.connector.mode = 'horde';
    }
    await sSet('settings:connector', state.connector);
    const lastId = await sGet('settings:lastOpen');
    if (lastId && state.index.find(s => s.id === lastId)){
      await loadStory(lastId);
    } else if (state.index.length){
      await loadStory(state.index[0].id);
    } else {
      const s = normalizeStory(newStory('Minha primeira aventura'));
      state.story = s;
      state.index.unshift({id:s.id, title:s.title, updatedAt:s.updatedAt});
      await sSet('story:' + s.id, s);
      await sSet('stories:index', state.index);
      await sSet('settings:lastOpen', s.id);
    }
    render();
    scrollFeedToBottom();
  }

  function normalizeMemory(m){
    if (!m) m = blankMemory();
    if (!m.characters) m.characters = [];
    if (!m.locations) m.locations = [];
    if (!m.groups) m.groups = [];
    if (typeof m.secrets !== 'string') m.secrets = '';
    if (typeof m.persona !== 'string') m.persona = '';
    if (typeof m.world !== 'string') m.world = '';
    if (typeof m.authorNote !== 'string') m.authorNote = '';
    if (typeof m.summary !== 'string') m.summary = '';
    if (typeof m.language !== 'string') m.language = 'pt-BR';
    if (typeof m.languageCustom !== 'string') m.languageCustom = '';
    if (!Array.isArray(m.chapters)) m.chapters = [];
    m.chapters.forEach(ch => {
      if (!Array.isArray(ch.archivedTurnIds)) ch.archivedTurnIds = [];
    });
    m.characters.forEach(c => {
      if (typeof c.age !== 'string') c.age = '';

  function cardTriggerWords(card){
    const triggers = [];
    if (card.name) triggers.push(...card.name.split(/\s+/));
    if (card.keywords) triggers.push(...card.keywords.split(','));
    return triggers.map(w => w.trim().toLowerCase()).filter(w => w.length >= 3);
  }
  function cardMatchesText(card, haystackLower){
    if (card.alwaysOn !== false) return true;
    return cardTriggerWords(card).some(w => haystackLower.includes(w));
  }
  function findLastMentionIndex(card, liveTurns){
    const words = cardTriggerWords(card);
    if (!words.length) return -1;
    for (let i = liveTurns.length - 1; i >= 0; i--){
      const low = liveTurns[i].text.toLowerCase();
      if (words.some(w => low.includes(w))) return i;
    }
    return -1;
  }
  function cardLine(type, c){
    if (type === 'char'){
      const tag = c.isProtagonist ? '[PROTAGONISTA] ' : '';
      const bits = [tag + (c.name || 'Sem nome')];
      if (c.origin) bits.push('origem: ' + c.origin);
      if (c.age) bits.push('idade: ' + c.age);
      if (c.appearance) bits.push('aparência: ' + c.appearance);
      if (c.personality) bits.push('personalidade: ' + c.personality);
      if (c.relations) bits.push('relações/família: ' + c.relations);
      if (c.desc) bits.push('histórico/papel: ' + c.desc);
      if (c.relationship) bits.push('relação atual c/ protagonista: ' + c.relationship);
      if (c.wants) bits.push('quer agora: ' + c.wants);
      if (c.status && c.status !== 'vivo') bits.push('status: ' + c.status);
      if (c.knows) bits.push('sabe até agora: ' + c.knows);
      return '- ' + bits.join(' | ');
    }
    if (type === 'loc'){
      const bits = [c.name || 'Sem nome'];
      if (c.origin) bits.push('origem: ' + c.origin);
      if (c.desc) bits.push('descrição: ' + c.desc);
      if (c.notes) bits.push('detalhes importantes: ' + c.notes);
      return '- ' + bits.join(' | ');
    }
    if (type === 'group'){
      const bits = [c.name || 'Sem nome'];
      if (c.members) bits.push('membros: ' + c.members);
      if (c.dynamic) bits.push('dinâmica/relação entre eles: ' + c.dynamic);
      return '- ' + bits.join(' | ');
    }
    return '';
  }
  function selectCardsWithinBudget(characters, locations, groups, liveTurns, haystackLower, budgetTokens){
    const makeCandidates = (list, type) => (list || []).map(c => ({
      type, card: c,
      alwaysOn: c.alwaysOn !== false,
      matched: cardMatchesText(c, haystackLower),
      lastMention: findLastMentionIndex(c, liveTurns)
    })).filter(x => x.alwaysOn || x.matched);

    const all = [
      ...makeCandidates(characters, 'char'),
      ...makeCandidates(locations, 'loc'),
      ...makeCandidates(groups, 'group')
    ];
    const mandatory = all.filter(x => x.alwaysOn);
    const optional = all.filter(x => !x.alwaysOn).sort((a, b) => b.lastMention - a.lastMention);

    const included = new Set(mandatory.map(x => x.card.id));
    let used = mandatory.reduce((sum, x) => sum + estimateTokens(cardLine(x.type, x.card)), 0);
    optional.forEach(cand => {
      const cost = estimateTokens(cardLine(cand.type, cand.card));
      if (used + cost > budgetTokens) return;
      used += cost;
      included.add(cand.card.id);
    });

    return {
      chars: (characters || []).filter(c => included.has(c.id)),
      locs: (locations || []).filter(c => included.has(c.id)),
      groups: (groups || []).filter(c => included.has(c.id))
    };
  }

  function extractUpdatesFromText(text, codeMap){
    if (!text) return { cleaned: text || '', updates: [] };
    let cleaned = text;
    let rawBlock = '';

    const markerRe = /===UPDATES===([\s\S]*?)===END\s*UPDATES===/i;
    const markerMatch = cleaned.match(markerRe);
    if (markerMatch){
      rawBlock = (markerMatch[1] || '').trim();
      cleaned = (cleaned.slice(0, markerMatch.index) + cleaned.slice(markerMatch.index + markerMatch[0].length)).trim();
    } else {
      const orphanLineRe = /^\s*\[([A-Za-z]\d{1,4})\]\s*([a-zA-Z_]+)\s*:\s*(.*?)\s*$/;
      const lines = cleaned.split('\n');
      const keptLines = [];
      const orphanLines = [];
      let orphanCount = 0;
      lines.forEach(line => {
        if (orphanLineRe.test(line.trim())){
          orphanCount++;
          orphanLines.push(line.trim());
        } else {
          keptLines.push(line);
        }
      });
      if (orphanCount > 0){
        rawBlock = orphanLines.join('\n');
        cleaned = keptLines.join('\n').trim();
      }
    }

    const updates = [];
    if (rawBlock){
      const lines = rawBlock.split('\n');
      lines.forEach(line => {
        const m = line.match(/^\s*\[([A-Za-z0-9]+)\]\s*([a-zA-Z_]+)\s*:\s*(.+?)\s*$/);
        if (!m) return;
        const code = m[1].toLowerCase();
        const field = m[2].toLowerCase();
        const value = m[3].trim();
        if (!codeMap || !codeMap[code]) return;
        if (!['relationship', 'knows', 'wants', 'status'].includes(field)) return;
        if (!value) return;
        updates.push({ cardId: codeMap[code], field, value });
      });
    }

    cleaned = cleaned.split('\n').filter(l => {
      const lt = l.trim();
      if (/^\[[A-Za-z]\d{1,4}\]\s*(relationship|knows|wants|status)\s*:/i.test(lt)) return false;
      if (/^\[[A-Za-z]\d{1,4}\]\s*$/.test(lt)) return false;
      return true;
    }).join('\n');
    cleaned = cleaned.replace(/\[[A-Za-z]\d{1,4}\]\s*(relationship|knows|wants|status)\s*:[^\n]*/gi, '');
    cleaned = cleaned.replace(/\[[A-Za-z]\d{1,4}\]/g, '');
    cleaned = cleaned.replace(/\n{3,}/g, '\n\n').trim();

    return { cleaned, updates };
  }

  async function buildPromptMessages(actionText, opts){
    opts = opts || {};
    const s = state.story;
    const conn = activeConnector();

    let liveTurns = s.turns.filter(t => !t.archived);
    if (opts.excludeTurnId) liveTurns = liveTurns.filter(t => t.id !== opts.excludeTurnId);
    liveTurns = selectTurnsByBudget(liveTurns, conn.historyTokenBudget || 3000, conn.maxHistoryTurns || 40);
    const haystackLower = (liveTurns.map(t => t.text).join(' ') + ' ' + (actionText || '')).toLowerCase();
    const activeCards = selectCardsWithinBudget(
      s.memory.characters, s.memory.locations, s.memory.groups,
      liveTurns, haystackLower, conn.cardsTokenBudget || 1200
    );

    let relevantMemories = [];
    if (!opts.skipRAG && _embedder){
      try{
        const recentTail = liveTurns.slice(-2).map(t => t.text).join(' ');
        const queryText = ((actionText || '') + ' ' + recentTail).slice(0, 800);
        relevantMemories = await searchRelevantTurns(queryText, { topK: VECTOR_TOP_K });
        const recentIds = new Set(liveTurns.map(t => t.id));
        relevantMemories = relevantMemories.filter(m => !recentIds.has(m.turnId));
      }catch(e){
        console.warn('RAG lookup falhou:', e);
      }
    }

    const protagCard = (s.memory.characters || []).find(c => c.isProtagonist);
    const protagName = protagCard && protagCard.name ? protagCard.name.trim() : '';
    const languageLine = buildLanguageInstruction(s.memory);

    // POV em prosa (sem lista com hífen)
    const povLine = [
      'PONTO DE VISTA: a NARRAÇÃO é em primeira pessoa do presente — o protagonista é sempre "eu" enquanto narra ("Eu entro na sala e vejo o General"). O DIÁLOGO segue regra normal: quando outro personagem fala diretamente com a protagonista, ele usa "você" ou o nome dela (por exemplo, ele pode perguntar "Você tem dezoito anos?"). Outros personagens, tanto na narração quanto no diálogo sobre eles, continuam em terceira pessoa ("ele sorri", "ela responde").'
    ].join('\n');

    // Formato + exemplos neutros
    const formatLine = 'FORMATO: prosa corrida, texto puro, sem markdown nem asteriscos. Ação e fala ficam dentro do parágrafo; falas em discurso direto usam só aspas ou travessão.';

    const voiceBlock = (protagCard && (protagCard.narrativeVoice || protagCard.voiceExample)) ? [
      'VOZ DA NARRAÇÃO: a história é narrada PELA ' + (protagName || 'protagonista') + ', não por um narrador neutro. Cada palavra precisa soar como ela pensaria, sentiria, escolheria.',
      protagCard.narrativeVoice ? ('Como ela narra: ' + protagCard.narrativeVoice) : '',
      protagCard.voiceExample ? ('Exemplos do tom dela (IMITE O ESTILO, não copie o conteúdo):\n' + protagCard.voiceExample) : '',
      'Regras da voz: vocabulário, ritmo e metáforas dela; emoções pela forma como ela descreve o mundo; o jeito dela olhar as coisas colore ação, paisagem e diálogo; a voz nunca se desliga.'
    ].filter(Boolean).join('\n') 
    : (protagName 
        ? ('VOZ DA NARRAÇÃO: a história é narrada PELA ' + protagName + ', então cada palavra precisa soar como ela pensaria, sentiria, escolheria. Evite narração neutra, formal ou genérica.')
        : 'VOZ DA NARRAÇÃO: escreva como se fosse a voz interna do protagonista — subjetiva, com personalidade, evitando narração neutra.');

    const omitUpdatesInstruction = !!opts.omitUpdatesInstruction;
    // Instrução de updates ENXUTA (item 6)
    const updatesInstruction = omitUpdatesInstruction ? '' : buildUpdatesInstructionShort(s.memory.characters || []);
    const codeMap = buildCardCodeMap(s.memory.characters || []);

    // Reordenação (item 5): updatesInstruction e "lembrete final" vão pro INÍCIO do system,
    // e o conteúdo descritivo (fichas, memória, regras) fica no fim, mais longe da ação.
    const sysParts = [
      'Você é o narrador de uma aventura interativa contínua, no estilo de um jogo de RPG textual.',
      updatesInstruction,  // perto do topo (item 5)
      'REGRA CRÍTICA DE SAÍDA: responda com a narração em prosa. NÃO copie nem parafraseie instruções do prompt, não repita títulos de bloco, não escreva listas de regras.',
      languageLine,
      povLine,
      voiceBlock,
      formatLine,
      // ---- conteúdo descritivo (fica no fim, longe da ação) ----
      'Continue a história de forma coerente com tudo que já aconteceu. Termine a cena em um momento de tensão ou decisão em aberto.',
      'TAMANHO DA RESPOSTA: cerca de ' + (conn.maxLength || 250) + ' tokens (~' + Math.max(3, Math.round((conn.maxLength || 250) * 0.7)) + ' palavras). SEMPRE termine numa frase completa.',
      s.memory.persona ? ('Persona/personagem principal: ' + s.memory.persona) : '',
      s.memory.world ? ('Mundo/cenário: ' + s.memory.world) : '',
      buildVectorMemoryBlock(relevantMemories),
      buildChaptersBlock(s.memory.chapters),
      buildCharactersBlock(activeCards.chars),
      buildLocationsBlock(activeCards.locs),
      buildGroupsBlock(activeCards.groups),
      s.memory.secrets ? (
        'SEGREDOS DO MUNDO (conhecimento do narrador, NÃO do protagonista): ' + s.memory.secrets +
        '\nRegra: nenhum personagem deve demonstrar saber dessas informações antes de descobri-las de fato na história.'
      ) : '',
      'Regra geral de conhecimento: cada personagem só sabe o que está descrito na ficha dele, mais o que já foi mostrado nas cenas anteriores.',
      'Regra contra "telepatia": os personagens NÃO leem a mente da protagonista — só reagem ao que ela de fato diz e faz em voz alta ou de forma visível. Cada personagem age de acordo com a PRÓPRIA personalidade, humor e objetivos.',
      s.memory.authorNote ? ('Notas do autor (siga sempre): ' + s.memory.authorNote) : '',
      opts.guidance ? ('INSTRUÇÃO ESPECÍFICA só pra esta próxima cena (siga à risca): ' + opts.guidance) : '',
      'Agora continue a história exatamente de onde ela parou.'
    ].filter(Boolean);

    const sys = sysParts.join('\n\n');

    const messages = [{role:'system', content: sys}];
    liveTurns.forEach(t => {
      messages.push({ role: t.type === 'user' ? 'user' : 'assistant', content: t.text });
    });

    // Reminder curto como SYSTEM extra (item 2 + 26), não como prefixo da ação.
    const shortReminder = '[1ª pessoa, presente, PT-BR.]';
    if (opts.isContinue){
      messages.push({role:'system', content: shortReminder});
      messages.push({role:'user', content: '(Continue a cena naturalmente a partir daqui, sem introduzir uma nova ação explícita do protagonista — apenas dê continuidade ao que já está acontecendo.)', isContinueMarker:true});
    } else {
      messages.push({role:'system', content: shortReminder});
      messages.push({role:'user', content: actionText});
    }
    return {messages, sys, liveTurns, ragUsed: relevantMemories.length, codeMap};
  }

  function recordDebug(provider, request, response, error){
    const c = activeConnector();
    if (!c.debugMode) return;
    state.ui.lastDebug = {
      provider, time: new Date().toLocaleTimeString('pt-BR'),
      request, response: response || null, error: error ? String(error) : null
    };
  }

  function computeGenLength(c, opts){
    if (opts && typeof opts.maxTokens === 'number') return opts.maxTokens;
    const base = c.maxLength || 250;
    const reserve = (typeof c.updatesTokenBudget === 'number') ? c.updatesTokenBudget : 80;
    return Math.max(1, base + reserve);
  }

  function normalizeEndpoint(url){
    let u = (url || '').trim().replace(/\/+$/, '');
    if (!u) return '';
    if (/\/chat\/completions$/i.test(u)) return u;
    if (/\/v1$/i.test(u)) return u + '/chat/completions';
    if (/\/completions?$/i.test(u)) return u;
    return u + '/v1/chat/completions';
  }

  function getApiConfig(){
    const c = activeConnector();
    if (c.mode === 'colab'){
      return {
        endpoint: normalizeEndpoint(c.colabEndpoint || ''),
        model: c.colabModel || 'local-model',
        key: c.colabKey || ''
      };
    }
    return {
      endpoint: normalizeEndpoint(c.oaEndpoint || ''),
      model: c.oaModel || '',
      key: c.oaKey || ''
    };
  }

  async function callApi(messages, opts){
    const conn = activeConnector();
    if (conn.mode === 'horde') return callAiHorde(messages, opts);
    return callOpenAICompatible(messages, opts);
  }

  function stripEcho(promptTail, text){
    if (!text) return text;
    let t = text.trim();
    const tail = (promptTail || '').trim().slice(-80);
    if (tail && t.startsWith(tail)) t = t.slice(tail.length).trim();
    // Loop de remoção de prefixo (item 18)
    const prefixRe = /^(?:\[JOGADOR\]:?|###\s*\w*:?|>>>|AI:|Narrador:)\s*/i;
    let guard = 0;
    while (prefixRe.test(t) && guard++ < 10){
      t = t.replace(prefixRe, '').trim();
    }
    return t;
  }

  async function callOpenAICompatible(messages, opts, attempt){
    opts = opts || {};
    attempt = attempt || 1;
    const c = activeConnector();
    const cfg = getApiConfig();
    if (!cfg.endpoint) throw new Error('Configure o endpoint da API nas Configurações.');
    if (!cfg.model) throw new Error('Preencha o nome do modelo nas Configurações.');
    const temperature = (typeof opts.temperature === 'number') ? opts.temperature : c.temperature;
    const maxTokens = computeGenLength(c, opts);
    const headers = {'Content-Type':'application/json'};
    if (cfg.key) headers['Authorization'] = 'Bearer ' + cfg.key;
    const reqBody = {
      model: cfg.model,
      messages,
      max_tokens: maxTokens,
      temperature,
      stop: NARRATION_STOP_SEQUENCES
    };
    let res, data;
    try{
      res = await fetch(cfg.endpoint, { method:'POST', headers, body: JSON.stringify(reqBody) });
    }catch(err){
      recordDebug(c.mode || 'openai', reqBody, null, err.message);
      throw new Error('Falha de rede ao chamar a API (' + err.message + '). Se estiver usando Colab, confira se o túnel ainda está ativo.');
    }
    if (res.status === 429 && attempt < 4){
      const t = await res.text().catch(()=> '');
      let waitSecs = 4;
      try{ const parsed = JSON.parse(t); waitSecs = (parsed.error && parsed.error.metadata && parsed.error.metadata.retry_after_seconds) || 4; }catch(e){}
      const retryHeader = res.headers.get('Retry-After');
      if (retryHeader) waitSecs = parseInt(retryHeader) || waitSecs;
      updateStatusOnly('Modelo com muita gente usando agora — tentando de novo em ' + waitSecs + 's…', false);
      await new Promise(r => setTimeout(r, waitSecs * 1000));
      return callOpenAICompatible(messages, opts, attempt + 1);
    }
    if (!res.ok){
      const t = await res.text().catch(()=> '');
      recordDebug(c.mode || 'openai', reqBody, t);
      throw new Error('API respondeu ' + res.status + ': ' + t.slice(0,200));
    }
    data = await res.json();
    recordDebug(c.mode || 'openai', reqBody, data);
    const choice = data.choices && data.choices[0];
    const text = choice && (choice.message ? choice.message.content : choice.text);
    if (!text) throw new Error('Resposta da API veio sem texto.');
    const cutOff = choice && (choice.finish_reason === 'length' || choice.finish_reason === 'max_tokens');
    const metaBits = [];
    if (data.usage) metaBits.push('~' + data.usage.total_tokens + ' tokens');
    if (cutOff) metaBits.push('⚠ cortada pelo limite');
    return { text: text.trim(), meta: metaBits.join(' · ') || null, usage: data.usage || null, cutOff };
  }

  async function callAiHorde(messages, opts){
    opts = opts || {};
    const c = activeConnector();
    const sys = messages.find(m => m.role === 'system');
    // Pega só a PRIMEIRA mensagem system (a principal), ignora reminders curtos.
    const history = messages.filter(m => m.role !== 'system' && !m.isContinueMarker);
    const storyBody = history.map(m => m.role === 'user' ? ('[JOGADOR]: ' + m.content) : m.content).join('\n\n');
    const promptText = (sys ? sys.content + '\n\n---\n\n' : '') + storyBody + '\n\n';

    const temperature = (typeof opts.temperature === 'number') ? opts.temperature : c.temperature;
    const genLength = computeGenLength(c, opts);
    const estimatedPromptTokens = Math.ceil(promptText.length / 3.2);
    const maxContextLength = Math.min(16384, Math.max(2048, estimatedPromptTokens + genLength + 512));
    const queueMsg = opts.queueMsg || 'Na fila do AI Horde… isso pode levar um tempinho.';

    const body = {
      prompt: promptText,
      params: {
        n: 1,
        max_context_length: maxContextLength,
        max_length: genLength,
        temperature,
        rep_pen: 1.1,
        top_p: 0.92,
        stop_sequence: NARRATION_STOP_SEQUENCES
      },
      nsfw: !!c.hordeNsfw,
      trusted_workers: false
    };
    if (c.hordeModels){
      body.models = c.hordeModels.split(',').map(s=>s.trim()).filter(Boolean);
    }

    let submitRes;
    try{
      submitRes = await fetch('https://aihorde.net/api/v2/generate/text/async', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'apikey': c.hordeKey || '0000000000'},
        body: JSON.stringify(body)
      });
    }catch(err){
      recordDebug('horde-submit', body, null, err.message);
      throw new Error('Falha de rede ao contatar o AI Horde.');
    }
    if (!submitRes.ok){
      const t = await submitRes.text().catch(()=> '');
      recordDebug('horde-submit', body, t);
      throw new Error('AI Horde recusou o pedido (' + submitRes.status + ')');
    }
    const submitData = await submitRes.json();
    recordDebug('horde-submit', body, submitData);
    const jobId = submitData.id;
    if (!jobId) throw new Error('AI Horde não retornou um id de geração.');

    const started = Date.now();
    while (Date.now() - started < 180000){
      await new Promise(r => setTimeout(r, 3000));
      updateStatusOnly(queueMsg, false);
      const statusRes = await fetch('https://aihorde.net/api/v2/generate/text/status/' + jobId);
      if (!statusRes.ok) continue;
      const statusData = await statusRes.json();
      recordDebug('horde-status', {jobId}, statusData);
      if (statusData.done && statusData.generations && statusData.generations.length){
        const gen = statusData.generations[0];
        const raw = gen.text || '';
        const finish = (gen.finish_reason || '').toLowerCase();
        const cutOff = finish === 'length';
        const clean = stripEcho(promptText, raw);
        if (!clean) throw new Error('Worker devolveu resposta vazia.');
        return { text: clean, meta: submitData.kudos != null ? (submitData.kudos + ' kudos') : null, kudos: submitData.kudos, cutOff };
      }
      if (statusData.faulted) throw new Error('A geração falhou no AI Horde.');
    }
    throw new Error('Tempo esgotado esperando o AI Horde.');
  }

  async function generate(actionText, opts){
    opts = opts || {};
    const conn = activeConnector();
    const characters = state.story.memory.characters || [];

    const wantAutoUpdates = ((conn.updatesTokenBudget || 0) > 0) && characters.length > 0;
    const canTwoPhase = (conn.mode === 'horde' || conn.mode === 'colab');
    const useTwoPhase = canTwoPhase && wantAutoUpdates;
    const singleCallWithUpdates = !canTwoPhase && wantAutoUpdates;

    let narrationResult;
    let updates = [];
    let updatesError = null;
    let ragUsed = 0;
    let codeMap = {};

    const p = await buildPromptMessages(actionText, Object.assign({}, opts, {
      omitUpdatesInstruction: !wantAutoUpdates
    }));
    ragUsed = p.ragUsed || 0;
    codeMap = p.codeMap || {};

    const narrationOpts = {};
    if (singleCallWithUpdates){
      narrationOpts.maxTokens = (conn.maxLength || 250) + (conn.updatesTokenBudget || 80);
    } else {
      narrationOpts.maxTokens = Math.max(20, conn.maxLength || 250);
    }

    narrationResult = await callApi(p.messages, narrationOpts);
    const rawTextForDebug = narrationResult.text;

    if (useTwoPhase && narrationResult.text){
      updateStatusOnly('Narração pronta — extraindo atualizações de ficha…', false);
      try{
        const updMessages = buildUpdatesOnlyMessages(narrationResult.text, characters);
        const updResult = await callApi(updMessages, {
          maxTokens: Math.max(120, conn.updatesTokenBudget || 80),
          temperature: 0.2,
          queueMsg: 'Extraindo atualizações…'
        });
        const parsed = extractUpdatesFromText(updResult.text, codeMap);
        updates = parsed.updates || [];
      }catch(e){
        console.warn('Extração de updates (fase 2) falhou:', e);
        updatesError = e.message || String(e);
      }
    } else if (singleCallWithUpdates){
      const parsed = extractUpdatesFromText(narrationResult.text, codeMap);
      narrationResult.text = parsed.cleaned;
      updates = parsed.updates || [];
    }

    narrationResult.text = cleanNarrationText(narrationResult.text, narrationResult.cutOff);
    narrationResult.ragUsed = ragUsed;
    narrationResult.updates = updates;
    narrationResult.updatesError = updatesError;
    narrationResult.usedTwoPhase = useTwoPhase;
    narrationResult.usedAutoUpdates = wantAutoUpdates;

    state.ui.lastRaw = {
      time: new Date().toLocaleTimeString('pt-BR'),
      raw: rawTextForDebug,
      cleaned: narrationResult.text,
      cutOff: !!narrationResult.cutOff,
      wasEmptied: !narrationResult.text || !narrationResult.text.trim()
    };
    if (narrationResult.meta){
      state.story.stats = state.story.stats || {totalTokens:0, totalKudos:0};
      if (narrationResult.usage) state.story.stats.totalTokens += (narrationResult.usage.total_tokens || 0);
      if (narrationResult.kudos) state.story.stats.totalKudos += narrationResult.kudos;
    }
    return narrationResult;
  }

  function trimToLastSentence(text){
    if (!text) return text;
    const trimmed = text.trim();
    if (!trimmed) return trimmed;
    if (/[.!?…]["')\]]?\s*$/.test(trimmed)) return trimmed;

    const paraIdx = trimmed.lastIndexOf('\n\n');
    if (paraIdx > 30 && paraIdx > trimmed.length * 0.4){
      const cut = trimmed.slice(0, paraIdx).trim();
      if (cut) return cut;
    }

    const re = /[.!?…](["')\]]?)(\s+[A-ZÀ-Ú"'\-—(]|$)/g;
    let lastGood = -1;
    let m;
    while ((m = re.exec(trimmed)) !== null){
      lastGood = m.index + 1 + (m[1] ? m[1].length : 0);
    }
    if (lastGood > 20){
      const cut = trimmed.slice(0, lastGood).trim();
      if (cut) return cut;
    }

    const lastSpace = trimmed.lastIndexOf(' ');
    if (lastSpace > 20){
      return trimmed.slice(0, lastSpace).trim();
    }
    return trimmed;
  }

  function cleanNarrationText(text, cutOff){
    if (!text) return text;
    const original = text;
    let t = text;
    t = t.replace(/\*\*(.*?)\*\*/gs, '$1');
    t = t.replace(/\*(.*?)\*/gs, '$1');
    t = t.replace(/\*/g, '');
    t = t.replace(/\[Lembrete[^\]]*\]/gi, ' ');
    t = t.replace(/\[1ª pessoa[^\]]*\]/gi, ' ');
    t = t.replace(/\[JOGADOR\][:\s]*/gi, ' ');
    t = t.replace(/\[continue em primeira pessoa[^\]]*\]/gi, ' ');
    t = t.replace(/\[continue a cena naturalmente[^\]]*\]/gi, ' ');
    t = t.replace(/\(Continue a cena naturalmente[^)]*\)/gi, ' ');
    t = t.replace(/\[INST\][\s\S]*?\[\/INST\]/gi, ' ');
    t = t.replace(/<\|[^|]*\|>/g, ' ');
    t = t.replace(/===UPDATES===[\s\S]*?(?:===END\s*UPDATES===|$)/gi, ' ');
    t = t.replace(/\[[A-Za-z]\d{1,4}\]\s*(relationship|knows|wants|status)\s*:[^\n]*/gi, '');
    t = t.replace(/\[[A-Za-z]\d{1,4}\]/g, '');

    // Filtros de conteúdo do prompt que costuma vazar (item 3)
    t = t.replace(/PONTO DE VISTA[^\n]*/gi, '');
    t = t.replace(/A NARRAÇÃO é em PRIMEIRA PESSOA[^\n]*/gi, '');
    t = t.replace(/O DIÁLOGO \(falas[^\n]*/gi, '');
    t = t.replace(/Outros personagens continuam em TERCEIRA PESSOA[^\n]*/gi, '');
    t = t.replace(/FORMATO:[^\n]*/gi, '');
    t = t.replace(/TAMANHO DA RESPOSTA:[^\n]*/gi, '');
    t = t.replace(/Continue a história de forma coerente[^\n]*/gi, '');
    t = t.replace(/Regra (geral de conhecimento|contra "telepatia")[^\n]*/gi, '');
    t = t.replace(/REGRA CRÍTICA DE SAÍDA:[^\n]*/gi, '');
    t = t.replace(/BLOCO DE ATUALIZAÇÕES[^\n]*/gi, '');
    t = t.replace(/ATUALIZAÇÕES DE ESTADO[^\n]*/gi, '');
    t = t.replace(/VOZ DA NARRAÇÃO[^\n]*/gi, '');
    t = t.replace(/FICHAS DE PERSONAGENS[^\n]*/gi, '');
    t = t.replace(/LOCAIS \(mantenha[^\n]*/gi, '');
    t = t.replace(/GRUPOS \/ DINÂMICA FAMILIAR[^\n]*/gi, '');
    t = t.replace(/RESUMO DOS CAPÍTULOS ANTERIORES[^\n]*/gi, '');
    t = t.replace(/TRECHOS RELEVANTES DA HISTÓRIA[^\n]*/gi, '');
    t = t.replace(/SEGREDOS DO MUNDO[^\n]*/gi, '');
    t = t.replace(/Notas do autor \(siga sempre\):[^\n]*/gi, '');
    t = t.replace(/INSTRUÇÃO ESPECÍFICA[^\n]*/gi, '');
    t = t.replace(/Persona\/personagem principal:[^\n]*/gi, '');
    t = t.replace(/Mundo\/cenário:[^\n]*/gi, '');
    t = t.replace(/LEMBRETE FINAL:[^\n]*/gi, '');
    t = t.replace(/^RESUMO:\s*$/gim, '');
    t = t.replace(/^- (Narração|Diálogo)[^\n]*/gim, '');

    t = t.split('\n').filter(line => {
      const l = line.trim().toLowerCase();
      if (!l) return true;
      if (l.startsWith('[lembrete') && l.endsWith(']')) return false;
      if (l.startsWith('lembrete:') && l.length < 300) return false;
      if (l.startsWith('[continue') && l.endsWith(']')) return false;
      if (l.startsWith('(continue') && l.endsWith(')')) return false;
      if (l === '===updates===' || l === '===end updates===') return false;
      return true;
    }).join('\n');
    t = t.replace(/^(###|>>>|AI:|Narrador:|Assistant:|System:)\s*/gim, '');
    t = t.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();

    if (!t || t.length < 3){
      let fallback = original.replace(/\*/g, '').replace(/\s+/g, ' ').trim();
      fallback = fallback.replace(/\[Lembrete[^\]]*\]/gi, ' ')
                           .replace(/===UPDATES===[\s\S]*?(?:===END\s*UPDATES===|$)/gi, ' ')
                           .replace(/\s+/g, ' ').trim();
      return fallback;
    }

    if (cutOff){
      t = trimToLastSentence(t);
    }
    return t;
  }

  function countMemoryDifferences(a, b){
    if (!a || !b) return 0;
    let count = 0;
    const aChars = a.characters || [];
    const bChars = b.characters || [];
    const bById = {};
    bChars.forEach(c => { bById[c.id] = c; });
    aChars.forEach(c => {
      const old = bById[c.id];
      if (!old) return;
      try{
        if (JSON.stringify(c) !== JSON.stringify(old)) count++;
      }catch(e){ /* ignora */ }
    });
    return count;
  }

  function addPendingUpdates(rawUpdates){
    if (!rawUpdates || !rawUpdates.length) return;
    const s = state.story;
    if (!s) return;
    if (!state.ui.pendingUpdates) state.ui.pendingUpdates = { items: [] };
    rawUpdates.forEach(u => {
      const card = (s.memory.characters || []).find(c => c.id === u.cardId);
      if (!card) return;
      const key = u.cardId + '|' + u.field;
      state.ui.pendingUpdates.items = state.ui.pendingUpdates.items.filter(it => (it.cardId + '|' + it.field) !== key);
      let oldValue = '';
      if (u.field === 'status') oldValue = card.status || 'vivo';
      else if (typeof card[u.field] === 'string') oldValue = card[u.field];
      state.ui.pendingUpdates.items.push({
        id: uid(),
        cardId: u.cardId,
        cardName: card.name || 'Sem nome',
        field: u.field,
        fieldLabel: UPDATE_FIELD_LABELS[u.field] || u.field,
        oldValue: oldValue,
        value: u.value
      });
    });
  }

    const s = state.story;
    const card = (s.memory.characters || []).find(c => c.id === item.cardId);
