  async function runMultiTurnExtraction(){
    const ep = state.ui.extractPicker;
    if (!ep || !ep.selectedIds.length || ep.loading) return;
    const s = state.story;
    const selected = s.turns
      .map((t, i) => ({ t, i }))
      .filter(x => ep.selectedIds.includes(x.t.id))
      .sort((a, b) => a.i - b.i)
      .map(x => x.t);
    if (!selected.length){
      ep.error = 'Nenhum turno válido selecionado.';
      render();
      return;
    }
    if (!(s.memory.characters || []).length){
      ep.error = 'Nenhum personagem cadastrado pra atualizar.';
      render();
      return;
    }

    ep.loading = true;
    ep.error = null;
    render();

    try{
      const codeMap = buildCardCodeMap(s.memory.characters);
      const messages = buildUpdatesOnlyMessages(selected, s.memory.characters);
      const totalText = selected.reduce((sum, t) => sum + (t.text || '').length + (t.sourceAction || '').length, 0);
      const estTokens = Math.ceil(totalText / 3.2);
      const opts = {
        maxTokens: Math.max(300, Math.min(1200, estTokens + 300)),
        temperature: 0.2,
        queueMsg: 'Analisando ' + selected.length + ' turno' + (selected.length > 1 ? 's' : '') + '…'
      };
      const result = await callApi(messages, opts);
      const {updates} = extractUpdatesFromText(result.text, codeMap);

      if (updates.length){
        addPendingUpdates(updates);
        state.ui.extractPicker = { open: false, selectedIds: [], loading: false, error: null };
        updateStatus(updates.length + ' atualizaç' + (updates.length > 1 ? 'ões' : 'ão') + ' sugerida' + (updates.length > 1 ? 's' : '') + ' a partir de ' + selected.length + ' turno' + (selected.length > 1 ? 's' : '') + '.', false);
        render();
      } else {
        ep.loading = false;
        ep.error = 'Nenhuma mudança de estado encontrada nos turnos selecionados.';
        render();
      }
    }catch(err){
      ep.loading = false;
      ep.error = err.message || String(err);
      render();
    }
  }

  function buildGenerationStatusNote(result){
    let note = result.meta ? ('Gerado ✓  ' + result.meta) : 'Gerado ✓';
    if (result.ragUsed){
      note += ' · 🧠 ' + result.ragUsed + ' memória' + (result.ragUsed > 1 ? 's' : '');
    }
    if (result.updatesError){
      note += ' · ⚠ updates falharam (' + result.updatesError + ')';
    } else if (result.usedTwoPhase){
      if (result.updates && result.updates.length){
        note += ' · 📝 ' + result.updates.length + ' atualizaç' + (result.updates.length > 1 ? 'ões' : 'ão');
      } else {
        note += ' · 📝 sem mudanças';
      }
    } else if (result.usedAutoUpdates && result.updates && result.updates.length){
      note += ' · 📝 ' + result.updates.length + ' atualizaç' + (result.updates.length > 1 ? 'ões' : 'ão');
    }
    return note;
  }

  async function retryLast(guidance){
    const s = state.story;
    if (state.ui.generating) return;
    const t = lastAiTurn();
    if (!t) return;
    pushUndo('retry');
    state.ui.generating = true;
    updateStatus('Gerando uma tentativa nova…', false);
    render();
    try{
      const opts = {excludeTurnId: t.id};
      if (guidance) opts.guidance = guidance;
      if (t.isContinue || (t.isOpening && !t.sourceAction)) opts.isContinue = true;
      const result = await generate(t.sourceAction || '', opts);
      if (!t.alts) t.alts = [t.text];
      t.alts.push(result.text);
      t.altIndex = t.alts.length - 1;
      t.text = result.text;
      if (result.updates && result.updates.length){
        addPendingUpdates(result.updates);
      }
      updateStatus(buildGenerationStatusNote(result), !!result.updatesError);

    const removed = s.turns.slice(idx + 1);
    s.turns = s.turns.slice(0, idx + 1);
    state.ui.openActionsFor = null;
    scheduleSave();
    updateStatus('Voltou pro ponto #' + (idx + 1) + memNote, false);

  async function summarizeOldTurns(){
    if (state.ui.summarizing || state.ui.pendingSummary) return;
    const s = state.story;
    const live = s.turns.filter(t => !t.archived);
    const chunk = live.slice(0, Math.max(0, live.length - 6));
    if (chunk.length < 2){
      updateStatus('Ainda não há trechos antigos suficientes pra resumir.', true);
      render();
      return;
    }
    state.ui.summarizing = true;
    updateStatus('Resumindo o início da história…', false);
    render();

    const protagCard = (s.memory.characters || []).find(c => c.isProtagonist);
    const protagName = protagCard && protagCard.name ? protagCard.name.trim() : '';
    const sysPrompt = [
      'Você é o narrador de uma história interativa e vai resumir uma passagem já escrita, pra que os eventos importantes fiquem disponíveis nos capítulos seguintes.',
      '',
      'Contexto da história:',
      s.memory.world ? ('- Mundo/cenário: ' + s.memory.world) : '',
      protagName ? ('- Protagonista: ' + protagName) : '',
      s.memory.authorNote ? ('- Tom/notas do autor: ' + s.memory.authorNote) : '',
      '',
      'INSTRUÇÕES DO RESUMO:',
      '- Escreva em prosa corrida, em TERCEIRA PESSOA neutra.',
      '- Preserve: decisões importantes, promessas, relações que mudaram, lugares visitados, objetos ganhos/perdidos, revelações, personagens apresentados.',
      '- Mantenha os nomes próprios EXATAMENTE como aparecem.',
      '- 4 a 6 frases curtas.',
      '- NÃO invente nada.',
      '- Responda APENAS com o resumo.'
    ].filter(Boolean).join('\n');

    try{
      const text = chunk.map(t => (t.type === 'user' ? 'AÇÃO: ' : 'NARRAÇÃO: ') + t.text).join('\n');
      const messages = [
        {role:'system', content: sysPrompt},
        {role:'user', content: 'Passagem a resumir:\n\n' + text}
      ];
      const sumOpts = {temperature: 0.3, maxTokens: 600};
      const result = await callApi(messages, sumOpts);

      state.ui.pendingSummary = {
        text: cleanNarrationText(result.text, result.cutOff),
        chunkIds: chunk.map(t => t.id)
      };
      updateStatus('Resumo pronto — revise abaixo.', false);
    }catch(err){
      updateStatus('Erro ao resumir: ' + err.message, true);
    }
    state.ui.summarizing = false;
    render();
  }

  function cardCollection(type){
    const mem = currentMemory();
    if (!mem) return [];
    if (type === 'char') return mem.characters;
    if (type === 'loc') return mem.locations;
    if (type === 'group') return mem.groups;
  }
  function blankCard(type){
    if (type === 'char') return {id: uid(), name:'', age:'', appearance:'', personality:'', desc:'', knows:'', origin:'', relations:'', isProtagonist:false, alwaysOn:true, keywords:'', narrativeVoice:'', voiceExample:'', relationship:'', wants:'', status:'vivo', lastSeenTurn:-1};
    if (type === 'loc') return {id: uid(), name:'', origin:'', desc:'', notes:'', alwaysOn:true, keywords:''};
    if (type === 'group') return {id: uid(), name:'', members:'', dynamic:'', alwaysOn:true, keywords:''};
  }
  function addCard(type){
    const c = blankCard(type);
    cardCollection(type).push(c);
    state.ui.expandedCard = {type, id: c.id};
    scheduleSave();
    render();
  }
  function duplicateCard(type, id){
    const list = cardCollection(type);
    const c = list.find(c => c.id === id);
    if (!c) return;
    const copy = Object.assign({}, c, {id: uid(), name: c.name ? c.name + ' (cópia)' : ''});
    if (type === 'char') copy.isProtagonist = false;
    const idx = list.findIndex(c => c.id === id);
    list.splice(idx + 1, 0, copy);
    scheduleSave();
    render();
  }
  function removeCard(type, id){
    const list = cardCollection(type);
    const card = list.find(x => x.id === id);
    if (!card) return;
    const typeLabel = type === 'char' ? 'personagem' : type === 'loc' ? 'local' : 'grupo';
    const nameLabel = card.name ? '"' + card.name + '"' : '(sem nome)';
    const ok = window.confirm('Apagar o ' + typeLabel + ' ' + nameLabel + '?\n\nEssa ação não pode ser desfeita.');
    if (!ok) return;
    const mem = currentMemory();
    if (type === 'char') mem.characters = list.filter(c => c.id !== id);
    if (type === 'loc') mem.locations = list.filter(c => c.id !== id);
    if (type === 'group') mem.groups = list.filter(c => c.id !== id);
    if (state.ui.expandedCard && state.ui.expandedCard.id === id){
      state.ui.expandedCard = null;
    }
    if (!isScenarioMode() && state.ui.pendingUpdates){
      state.ui.pendingUpdates.items = state.ui.pendingUpdates.items.filter(it => it.cardId !== id);
      if (!state.ui.pendingUpdates.items.length) state.ui.pendingUpdates = null;
    }
    scheduleSave();
    render();
  }
  function updateCard(type, id, field, value){
    const list = cardCollection(type);
    const c = list.find(c => c.id === id);
    if (!c) return;
    c[field] = value;
    if (type === 'char' && field === 'isProtagonist' && value === true){
      list.forEach(other => { if (other.id !== id) other.isProtagonist = false; });
    }
    scheduleSave();
  }

  function removeChapter(id){
    const mem = currentMemory();
    if (!mem) return;
    const ch = mem.chapters.find(c => c.id === id);
    if (!ch) return;
    const hasIds = ch.archivedTurnIds && ch.archivedTurnIds.length;
    let msg = 'Apagar este capítulo resumido?';
    if (hasIds){
      msg += '\n\nAs ' + ch.archivedTurnIds.length + ' falas originais vão voltar ao contexto ativo.';
    } else {
      msg += '\n\n(Este capítulo é de versão antiga — não dá pra restaurar automaticamente.)';
    }
    const ok = window.confirm(msg);
    if (!ok) return;
    if (hasIds && state.story){
      ch.archivedTurnIds.forEach(tid => {
        const t = state.story.turns.find(x => x.id === tid);
        if (t){
          t.archived = false;
          updateVectorArchived(tid, false).catch(() => {});
        }
      });
    }
    mem.chapters = mem.chapters.filter(c => c.id !== id);
    scheduleSave();
    render();
  }

  function unarchiveAllTurns(){
    const s = state.story;
    if (!s) return;
    const archivedCount = s.turns.filter(t => t.archived).length;
    if (!archivedCount){
      updateStatus('Não há falas arquivadas pra restaurar.', false);
      render();
      return;
    }
    const ok = window.confirm('Desarquivar TODAS as ' + archivedCount + ' falas arquivadas?');
    if (!ok) return;
    s.turns.forEach(t => {
      if (t.archived){
        t.archived = false;
        updateVectorArchived(t.id, false).catch(() => {});
      }
    });
    updateStatus(archivedCount + ' falas desarquivadas.', false);
    scheduleSave();
    render();
  }

    let raw = '';
    if (type === 'char') raw = c.relationship || c.desc || c.personality || c.appearance || c.relations || '';
    else if (type === 'loc') raw = c.desc || c.notes || '';
    else raw = c.dynamic || c.members || '';
    raw = (raw || '').replace(/\s+/g, ' ').trim();
    if (raw.length > 140) raw = raw.slice(0, 137) + '…';
    return raw;
  }

  async function deleteStory(id){
    const ok = window.confirm('Apagar esta aventura pra sempre?');
    if (!ok) return;
    await sDelete('story:' + id);
    if (state.drive.signedIn){
      try{
        const file = await driveFindVectorFile(id);
        if (file){
          await driveFetch('https://www.googleapis.com/drive/v3/files/' + file.id, { method: 'DELETE' });
        }
      }catch(e){}
    }
    try{
      const db = await openVectorDb();
      const tx = db.transaction(VECTOR_STORE, 'readwrite');
      const idx = tx.objectStore(VECTOR_STORE).index('storyId');
      const req = idx.openCursor(id);
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor){ cursor.delete(); cursor.continue(); }
      };
    }catch(e){}
    state.index = state.index.filter(s => s.id !== id);
    await sSet('stories:index', state.index);
    if (state.story && state.story.id === id){
      if (state.index.length){
        await loadStory(state.index[0].id);
      } else {
        resetStoryUiState();
        const s = normalizeStory(newStory('Nova aventura'));
        state.story = s;
        state.index.unshift({id:s.id, title:s.title, updatedAt:s.updatedAt});
        await sSet('story:' + s.id, s);
        await sSet('stories:index', state.index);
      }
    }
    render();
  }

  function exportStory(){
    const blob = new Blob([JSON.stringify(state.story, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (state.story.title || 'aventura').replace(/[^a-z0-9]/gi,'_') + '.json';
    a.click();
    URL.revokeObjectURL(url);

  function importStory(file){
    const reader = new FileReader();
    reader.onload = async (e) => {
      try{
        resetStoryUiState();
        const s = normalizeStory(JSON.parse(e.target.result));
        s.id = uid();
        s.updatedAt = Date.now();
        state.index.unshift({id:s.id, title:s.title || 'Importada', updatedAt:s.updatedAt});
        state.story = s;
        await sSet('story:' + s.id, s);
        await sSet('stories:index', state.index);
        await sSet('settings:lastOpen', s.id);
        state.ui.modal = null;
        render();
        syncStoryVectors().catch(() => {});
      }catch(err){
        alert('Arquivo inválido.');
      }
    };
    reader.readAsText(file);
  }

  function autoSizeTextarea(el){

  let _tokenEstimateTimer = null;
  function updateTokenEstimateDisplay(){
    clearTimeout(_tokenEstimateTimer);
    _tokenEstimateTimer = setTimeout(async () => {
      const el = document.getElementById('tokenEstimate');
      if (!el || !state.story) return;
      try{
        const draft = state.ui.composerText || '';
        const {messages} = await buildPromptMessages(draft, { skipRAG: true });
        const total = messages.reduce((sum, m) => sum + estimateTokens(m.content), 0);
        el.textContent = '≈ ' + total + ' tokens nesta próxima mensagem (estimativa)';
      }catch(e){
        el.textContent = '';
      }
    }, 500);
  }

  function renderTurn(t, i, extraClass){
    const isEditing = editingTurnId === t.id;
    const label = (t.archived ? ' · arquivado' : '') + (t.isContinue ? ' · continuação' : '') + (t.isOpening ? ' · abertura' : '');
    const extra = extraClass ? ' ' + extraClass : '';
    if (isEditing){
      const draft = (state.ui.editingDraft && state.ui.editingDraft.turnId === t.id)
        ? state.ui.editingDraft.text
        : t.text;
      return `<span class="turn ${t.type}${extra} ${t.archived?'archived':''}" data-turnid="${t.id}">
        <textarea class="turn-editbox" data-editbox="${t.id}" rows="4">${esc(draft)}</textarea>
        <span class="actions" style="opacity:1;">
          <button data-save="${t.id}">salvar</button>
          <button data-cancel="${t.id}">cancelar</button>
        </span>
      </span>`;
    }
    const menuOpen = state.ui.openActionsFor === t.id;

    const updReserve = (typeof c.updatesTokenBudget === 'number') ? c.updatesTokenBudget : 80;

    bind('#btnExtractGo','click', runMultiTurnExtraction);
    const extractOverlay = $('#extractPickerOverlay');
    if (extractOverlay) extractOverlay.addEventListener('click', (e) => {
      if (e.target.id === 'extractPickerOverlay') closeExtractPicker();
    });
    $$('[data-extract-id]').forEach(chk => chk.addEventListener('change', (e) => {
      e.stopPropagation();
      toggleExtractSelection(e.target.dataset.extractId);
    }));
    $$('.extract-item').forEach(el => el.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      e.preventDefault();
      const chk = el.querySelector('[data-extract-id]');
      if (chk) toggleExtractSelection(chk.dataset.extractId);
    }));

    bind('#closeNewAdventure','click', () => { state.ui.newAdventureModal = null; render(); });
    bind('#btnNewAdvCancel','click', () => { state.ui.newAdventureModal = null; render(); });
    bind('#btnNewAdvCreate','click', async () => {
      const t = (document.getElementById('newAdvTitle') || {}).value || '';
      const sid = (document.getElementById('newAdvScenario') || {}).value || '';
      await createStoryFromScenario(sid || null, t.trim() || null);
    });
    const newAdvSelect = $('#newAdvScenario');
    if (newAdvSelect){
      newAdvSelect.addEventListener('change', (e) => {
        if (state.ui.newAdventureModal){
          state.ui.newAdventureModal.scenarioId = e.target.value;
          const tInput = document.getElementById('newAdvTitle');
          if (tInput) state.ui.newAdventureModal.title = tInput.value;
          render();
        }
      });
    }
    const newAdvOverlay = $('#newAdventureOverlay');
    if (newAdvOverlay) newAdvOverlay.addEventListener('click', (e) => {
      if (e.target.id === 'newAdventureOverlay'){ state.ui.newAdventureModal = null; render(); }
    });

    $$('.spine .tab').forEach(t => t.onclick = () => rewindTo(t.dataset.jump));
    $$('[data-turntap]').forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return;
      const id = el.dataset.turntap;
      state.ui.openActionsFor = (state.ui.openActionsFor === id) ? null : id;
      render();
    }));
    $$('[data-edit]').forEach(b => b.onclick = () => startEdit(b.dataset.edit));
    $$('[data-cancel]').forEach(b => b.onclick = cancelEdit);
    $$('[data-save]').forEach(b => b.onclick = () => {
      const box = document.querySelector('[data-editbox="'+b.dataset.save+'"]');
      saveEdit(b.dataset.save, box.value);
    });
    $$('[data-rewind]').forEach(b => b.onclick = () => rewindTo(b.dataset.rewind));
    $$('[data-del]').forEach(b => b.onclick = () => deleteTurn(b.dataset.del));

    bind('#closeSettings','click', () => { state.ui.modal = null; render(); });
    bind('#overlaySettings','click', (e) => { if (e.target.id === 'overlaySettings'){ state.ui.modal = null; render(); } });
    bind('#connMode','change', e => { state.connector.mode = e.target.value; render(); state.ui.modal = 'settings'; });
    bind('#btnGoogleSignIn','click', signInWithGoogle);
    bind('#btnGoogleSignOut','click', signOutGoogle);
    bind('#saveSettings','click', async () => {
      const c = state.connector;
      const g = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
      if (c.mode === 'horde'){
        c.hordeKey = g('hordeKey') || '0000000000';
        const nsfwEl = document.getElementById('hordeNsfw');
        c.hordeNsfw = nsfwEl ? !!nsfwEl.checked : c.hordeNsfw;
        c.hordeModels = g('hordeModels') || '';
      } else if (c.mode === 'colab'){
        c.colabEndpoint = (g('colabEndpoint') || '').trim();
        c.colabModel = (g('colabModel') || 'local-model').trim() || 'local-model';
        c.colabKey = g('colabKey') || '';
      } else if (c.mode === 'openai'){
        c.oaEndpoint = g('oaEndpoint') || '';
        c.oaKey = g('oaKey') || '';
        c.oaModel = g('oaModel') || '';
      }
      c.maxLength = parseInt(g('maxLength')) || 250;
      const updVal = g('updatesTokenBudget');
      c.updatesTokenBudget = (updVal !== undefined) ? Math.max(0, parseInt(updVal) || 0) : 80;
      c.temperature = parseFloat(g('temperature')) || 0.85;
      c.historyTokenBudget = parseInt(g('historyTokenBudget')) || 3000;
      c.maxHistoryTurns = parseInt(g('maxHistoryTurns')) || 40;
      c.cardsTokenBudget = parseInt(g('cardsTokenBudget')) || 1200;
      const dbgEl = document.getElementById('debugMode');
      c.debugMode = dbgEl ? !!dbgEl.checked : false;
      await sSet('settings:connector', c);
      state.ui.modal = null;
      updateStatus('Configurações salvas.', false);
      render();
    });

    bind('#btnForceVectorUpload','click', async () => {
      updateStatus('Enviando vetores pro Drive…', false);
      await uploadVectorsToDrive();
    });
    bind('#btnForceVectorDownload','click', async () => {
      if (!state.story) return;
      updateStatus('Baixando vetores do Drive…', false);
      const ok = await downloadVectorsFromDrive(state.story.id);
      if (ok){
        state.ui.vectorCount = await countStoryVectors(state.story.id);
        updateStatus('Vetores sincronizados.', false);
      } else {
        updateStatus('Nada novo pra baixar.', false);
      }
      render();
    });

    bind('#btnResetVectorCache','click', async () => {
      const ok = window.confirm('Resetar o cache do modelo?\n\nApaga o modelo baixado e os vetores locais. Os do Drive NÃO são afetados.');
      if (!ok) return;
      try{
        if ('caches' in window){
          const names = await caches.keys();
          for (const name of names){
            if (name.toLowerCase().includes('transformers') || name.toLowerCase().includes('huggingface')){
              await caches.delete(name);
            }
          }
        }
        try{ indexedDB.deleteDatabase(VECTOR_DB_NAME); }catch(e){}
        _embedder = null;
        _embedderPromise = null;
        _vectorDb = null;
        state.ui.vectorReady = false;
        state.ui.vectorError = null;
        state.ui.vectorCount = 0;
        state.ui.vectorIndexing = 0;
        updateStatus('Cache resetado. Recarregue a página.', false);
        render();
      }catch(err){
        updateStatus('Erro ao resetar: ' + err.message, true);
      }
    });

    bind('#btnToggleVectorDebug','click', () => {
      state.ui.debugVector.open = !state.ui.debugVector.open;
      render();
    });
    bind('#debugVectorQuery','input', e => {
      state.ui.debugVector.query = e.target.value;
    });
    bind('#debugVectorQuery','keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); runDebugVectorSearch(); }
    });
    bind('#btnRunDebugSearch','click', runDebugVectorSearch);
    bind('#btnClearDebugResults','click', () => {
      state.ui.debugVector.results = null;
      state.ui.debugVector.error = null;
      render();
    });

    bind('#debugMode','change', e => {
      state.connector.debugMode = !!e.target.checked;
      setTimeout(() => { state.ui.modal = 'settings'; render(); }, 0);
    });
    bind('#btnTestApiDebug','click', runApiDebugTest);
    bind('#btnClearApiDebug','click', () => {
      state.ui.lastDebug = null;
      state.ui.lastRaw = null;
      render();
    });

    bind('#closeStories','click', () => { state.ui.modal = null; render(); });
    bind('#overlayStories','click', (e) => { if (e.target.id === 'overlayStories'){ state.ui.modal = null; render(); } });

    $$('[data-storiestab]').forEach(b => b.onclick = () => {
      state.ui.storiesTab = b.dataset.storiestab;
      render();
    });

    bind('#btnCreateStory','click', createStory);
    bind('#btnCreateScenario','click', createScenario);
    bind('#btnExportStory','click', exportStory);
    bind('#btnImportTrigger','click', () => document.getElementById('importInput').click());
    bind('#importInput','change', e => { if (e.target.files && e.target.files[0]) importStory(e.target.files[0]); });
    $$('[data-open]').forEach(b => b.onclick = () => { loadStory(b.dataset.open); state.ui.modal = null; });
    $$('[data-delstory]').forEach(b => b.onclick = () => deleteStory(b.dataset.delstory));

    $$('[data-edit-scenario]').forEach(b => b.onclick = () => {
      state.ui.modal = null;
      openScenarioEditor(b.dataset.editScenario);
    });
    $$('[data-play-scenario]').forEach(b => b.onclick = () => {
      state.ui.newAdventureModal = { title: '', scenarioId: b.dataset.playScenario };
      render();
    });
    $$('[data-dup-scenario]').forEach(b => b.onclick = () => duplicateScenario(b.dataset.dupScenario));
    $$('[data-del-scenario]').forEach(b => b.onclick = () => deleteScenario(b.dataset.delScenario));
  }

  async function runDebugVectorSearch(){
    const q = (state.ui.debugVector.query || '').trim();
    if (!q){
      state.ui.debugVector.error = 'Digite uma frase.';
      render();
      return;
    }
    state.ui.debugVector.loading = true;
    state.ui.debugVector.error = null;
    state.ui.debugVector.results = null;
    render();
    try{
      if (!_embedder){ await initEmbedder(); }
      const results = await searchRelevantTurns(q, { topK: 8, threshold: 0.2 });
      state.ui.debugVector.results = results;
      state.ui.debugVector.loading = false;
    }catch(err){
      state.ui.debugVector.loading = false;
      state.ui.debugVector.error = err.message || String(err);
    }
    render();
  }

  async function runApiDebugTest(){
    if (state.ui.debugTestLoading) return;
    if (!state.story) return;
    state.ui.debugTestLoading = true;
    state.ui.debugTestError = null;
    render();
    try{
      const testMessages = [
        {role:'system', content:'Você é um narrador de RPG. Responda em uma única frase.'},
        {role:'user', content:'Teste. Narre em uma frase: "eu abro a porta".'}
      ];
      const opts = {maxTokens: 60, temperature: 0.5};
      await callApi(testMessages, opts);
      state.ui.debugTestError = null;
    }catch(err){
      state.ui.debugTestError = err.message || String(err);
    }
    state.ui.debugTestLoading = false;
    state.ui.modal = 'settings';
    render();
  }

  // ---------- bootstrap ----------
  init();
  attemptSilentGoogleSignIn();

  setTimeout(() => {
    initEmbedder()
      .then(async () => {
        if (state.story){
          state.ui.vectorCount = await countStoryVectors(state.story.id);
        }
        render();
        if (state.story){
          syncVectorsWithDrive(state.story.id).catch(() => {});
        }
      })
      .catch(err => {
        console.warn('Falha ao inicializar embedder:', err);
        render();
      });
  }, 1500);

})();
</script>
</body>
</html>
