<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aventura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Literata:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root{
    --ink: #14161d;
    --panel: #1b1e28;
    --panel-2: #21242f;
    --border: rgba(255,255,255,0.08);
    --muted: #9a9fb0;
    --amber: #d59a44;
    --amber-dim: #a97a3a;
    --rust: #b5502f;
    --parchment: #efe6d3;
    --parchment-ink: #2b2420;
    --parchment-2: #e6dabf;
  }
  *{box-sizing:border-box;}
  body,html{margin:0;padding:0; overflow-x:hidden; height:100%;}
  input, textarea, select{ max-width:100%; min-width:0; }
  #app{
    font-family:'Literata', serif;
    background: var(--ink);
    color: #e9e6de;
    height:100vh;
    height:100dvh;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Fraunces', serif;}

  /* header */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    background: linear-gradient(180deg, #181a22, #14161d);
    position:sticky; top:0; z-index:20;
  }
  header .titlewrap{display:flex; align-items:baseline; gap:10px; min-width:0;}
  header h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:19px; margin:0;
    color:#f1ead8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header .tag{font-family:'JetBrains Mono'; font-size:10px; color:var(--amber); letter-spacing:.08em; text-transform:uppercase;}
  header .btns{display:flex; gap:8px; flex-shrink:0;}
  button{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    background: var(--panel-2); color:#e9e6de; border:1px solid var(--border);
    padding:8px 12px; border-radius:6px; cursor:pointer; letter-spacing:.02em;
    transition: border-color .15s, background .15s;
  }
  button:hover{ border-color: var(--amber-dim); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; }
  button.primary{ background: var(--amber); color:#221806; border-color:var(--amber); font-weight:600; }
  button.primary:hover{ background:#e3a851; }
  button.danger{ color:#f0b7a4; border-color: var(--rust); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:default; }
  button.icon{ padding:8px 9px; }

  /* layout */
  .layout{
    display:grid;
    grid-template-columns: 1fr 46px;
    flex:1;
    min-height:0;
    max-width:1500px;
    width:100%;
    margin:0 auto;
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; max-width:none; }
    .spine{ display:none; }
  }
  /* alternância manual celular/PC, sobrepõe a media query acima */
  #app.force-mobile .layout{ grid-template-columns: 1fr !important; max-width:none !important; }
  #app.force-mobile .spine{ display:none !important; }
  #app.force-mobile .page{ max-width:100% !important; }
  #app.force-desktop .layout{ grid-template-columns: 1fr 46px !important; max-width:1500px !important; }
  #app.force-desktop .spine{ display:flex !important; }
  .layout-toggle{ font-size:10px !important; padding:6px 9px !important; }

  /* memory panel — agora é uma gaveta que desliza, não faz parte do grid */
  .layout > *{ min-width:0; }
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(8,9,13,.55); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .memory-panel{
    position:fixed; top:0; left:0; height:100vh; width:340px; max-width:88vw;
    background: var(--panel);
    border-right:1px solid var(--border);
    padding:16px;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex; flex-direction:column; gap:14px;
    z-index:41;
    transform:translateX(-100%);
    transition:transform .22s ease;
    box-shadow: 6px 0 28px rgba(0,0,0,.35);
  }
  .memory-panel.open{ transform:translateX(0); }
  .memory-panel-close{ align-self:flex-end; }
  .memory-panel h2{ font-family:'Fraunces'; font-size:13.5px; color:var(--amber); text-transform:uppercase; letter-spacing:.08em; margin:0 0 6px; cursor:pointer; display:flex; align-items:center; gap:6px; user-select:none; }
  .memory-panel h2 .chevron{ font-size:11px; opacity:.7; }
  .field label{ display:block; font-family:'JetBrains Mono'; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
  .field textarea, .field input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:#e9e6de; font-family:'Literata'; font-size:14.5px; line-height:1.5; padding:10px 11px; resize:vertical;
  }
  .field textarea:focus, .field input:focus{ outline:none; border-color: var(--amber-dim); }
  .field{ margin-bottom:12px; }
  .pov-toggle{ display:flex; gap:6px; }
  .pov-toggle button{ flex:1; }
  .pov-toggle button.active{ background:var(--amber); color:#221806; border-color:var(--amber); }
  .summ-note{ font-size:11px; color:var(--muted); line-height:1.5; }
  .summ-note.err{ color:#f0b7a4; }

  /* main / feed */
  main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
  .feed{
    flex:1; overflow-y:auto; padding:22px 24px 30px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(213,154,68,0.06), transparent 60%),
      var(--ink);
  }
  .page{
    max-width:720px; margin:0 auto; background:var(--parchment); color:var(--parchment-ink);
    border-radius:10px; padding:26px 30px; font-size:15.5px; line-height:1.75;
    box-shadow: 0 1px 0 rgba(0,0,0,.2), inset 0 0 0 1px rgba(0,0,0,.04);
    white-space: pre-wrap;
  }
  .turn{ position:relative; display:inline; }
  .turn.user{ font-style:italic; color:#5a4a30; }
  .turn.ai{ }
  .turn.archived{ opacity:.4; }
  .turn-sep{ display:block; height:0.6em; }
  .turn .actions{
    display:inline-flex; gap:5px; margin-left:6px; opacity:0; transition:opacity .12s;
    vertical-align:middle;
  }
  .turn:hover .actions, .turn:focus-within .actions{ opacity:.85; }
  .turn .actions button{
    padding:2px 6px; font-size:9px; background:rgba(43,36,32,0.08); color:var(--parchment-ink);
    border:1px solid rgba(43,36,32,0.18); border-radius:4px;
  }
  .turn .actions button:hover{ background:rgba(43,36,32,0.16); }
  .turn-editbox{
    display:block; width:100%; background:rgba(43,36,32,0.05); border:1px solid rgba(43,36,32,0.2); border-radius:6px;
    color:var(--parchment-ink); font-family:'Literata'; font-size:15.5px; line-height:1.7; padding:8px 10px;
    resize:vertical; margin:6px 0;
  }
  .turn-editbox:focus{ outline:none; border-color: var(--amber-dim); }
  .empty-state{ max-width:520px; margin:60px auto; text-align:center; color:var(--muted); }
  .empty-state h2{ font-family:'Fraunces'; color:#f1ead8; font-weight:600; }

  .composer{
    border-top:1px solid var(--border); padding:14px 24px; background:#171922;
  }
  .composer-inner{ max-width:720px; margin:0 auto; }
  .composer textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    color:#e9e6de; font-family:'Literata'; font-size:14.5px; padding:11px 12px; resize:none;
    min-height:52px;
  }
  .composer textarea:focus{ outline:none; border-color:var(--amber-dim); }
  .composer-row{ display:flex; gap:8px; margin-top:8px; align-items:center; }
  .dungeon-bar{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:9px; }
  .dungeon-bar button{ padding:9px 13px; font-size:11.5px; white-space:nowrap; }
  .dungeon-bar-secondary{ margin-top:6px; }
  .dungeon-bar-secondary button{ padding:6px 11px; font-size:10.5px; opacity:.8; }
  .retry-group{
    display:flex; align-items:center; gap:0;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
  }
  .retry-group button{ border:none; border-radius:0; background:transparent; white-space:nowrap; }
  .retry-group button:not(:last-child){ border-right:1px solid var(--border); }
  .retry-nav{ padding:9px 10px !important; }
  .retry-count{ padding:0 8px; font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .dungeon-bar-main{ display:flex; gap:7px; }
  .dungeon-bar-main > button{ flex:1 1 0; }
  .dungeon-bar-main > .retry-group{ flex:1.4 1 0; justify-content:center; }
  .dungeon-bar-secondary button{ flex:0 0 auto; }
  @media (max-width: 480px){
    .dungeon-bar button{ padding:10px 8px; font-size:11px; }
    .retry-group{ display:flex; }
    .retry-group button{ flex:1 1 auto; padding-left:6px !important; padding-right:6px !important; }
    .dungeon-bar-secondary{ flex-wrap:wrap; }
    .dungeon-bar-secondary button{ font-size:10px; padding:6px 9px; }
  }
  .composer-row .spacer{ flex:1; }
  .status{ font-family:'JetBrains Mono'; font-size:11px; color:var(--muted); }
  .status.err{ color:#f0b7a4; }
  .save-warning{ font-family:'JetBrains Mono'; font-size:10.5px; color:#f0b7a4; margin-right:6px; }

  /* spine */
  .spine{
    background:var(--panel); border-left:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0; overflow-y:auto;
  }
  .spine .tab{
    width:28px; height:20px; border-radius:4px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--muted); font-family:'JetBrains Mono'; font-size:9px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .spine .tab.ai{ border-color: rgba(213,154,68,.35); }
  .spine .tab.current{ background:var(--amber); color:#221806; border-color:var(--amber); font-weight:700; }
  .spine .tab:hover{ border-color:var(--amber); }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,14,.65); backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:22px;
  }
  .modal h2{ font-family:'Fraunces'; margin-top:0; color:#f1ead8; }
  .modal .close{ float:right; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .story-item{
    display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border);
    border-radius:7px; margin-bottom:8px; background:var(--panel-2);
  }
  .story-item .info{ flex:1; min-width:0; }
  .story-item .info .t{ font-family:'Fraunces'; font-size:14px; color:#f1ead8; }
  .story-item .info .d{ font-family:'JetBrains Mono'; font-size:10px; color:var(--muted); }
  .helpbox{ font-size:12px; color:var(--muted); line-height:1.6; background:var(--panel-2); border-radius:7px; padding:10px 12px; margin-top:6px; }
  .helpbox a{ color:var(--amber); }
  select{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:#e9e6de; font-family:'JetBrains Mono'; font-size:12px; padding:8px 9px;
  }
  .divider{ height:1px; background:var(--border); margin:16px 0; }
  .char-card{ background:var(--panel-2); border:1px solid var(--border); border-radius:7px; padding:9px; margin-bottom:8px; }
  .char-card input[type=text]{ background:var(--ink); border:1px solid var(--border); border-radius:5px; color:#e9e6de; font-family:'Fraunces'; font-size:14.5px; padding:9px 10px; }
  .char-card textarea{ background:var(--ink); border:1px solid var(--border); border-radius:5px; color:#e9e6de; font-family:'Literata'; font-size:14px; line-height:1.5; padding:9px 10px; width:100%; resize:vertical; margin-top:6px; min-height:52px; }
  .ccard-top{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .ccard-top{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .ccard-toggle{ padding:4px 7px; font-size:11px; flex-shrink:0; }
  .ccard-row2{ display:grid; grid-template-columns: 70px 1fr; gap:6px; margin-bottom:6px; }
  .ccard-row2 input{ width:100%; min-width:0; background:var(--ink); border:1px solid var(--border); border-radius:5px; color:#e9e6de; font-family:'JetBrains Mono'; font-size:13px; padding:9px 9px; }
  .protag-badge{ font-family:'JetBrains Mono'; font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:#221806; background:var(--amber); padding:2px 6px; border-radius:4px; flex-shrink:0; }
  .protag-check{ display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--amber); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  // ---------- armazenamento: nativo (Claude) | Google Drive | local ----------
  function backend(){
    if (state.drive && state.drive.signedIn) return 'drive';
    if (typeof window.storage !== 'undefined' && window.storage) return 'native';
    return 'local';
  }

  async function sGet(key){
    const b = backend();
    if (b === 'native'){
      try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if (b === 'drive'){
      await ensureDriveLoaded();
      return (key in state.drive.store) ? state.drive.store[key] : null;
    }
    try{
      const raw = localStorage.getItem('aventura:' + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  async function sSet(key, val, attempt){
    const b = backend();
    attempt = attempt || 0;
    if (b === 'native'){
      try{
        await window.storage.set(key, JSON.stringify(val), false);
        return true;
      }catch(e){
        if (attempt < 2){
          await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
          return sSet(key, val, attempt + 1);
        }
        console.error('storage set failed after retries', e);
        return false;
      }
    }
    if (b === 'drive'){
      await ensureDriveLoaded();
      state.drive.store[key] = val;
      scheduleDriveUpload();
      return true;
    }
    try{ localStorage.setItem('aventura:' + key, JSON.stringify(val)); return true; }
    catch(e){ console.error('localStorage set failed', e); return false; }
  }

  async function sDelete(key){
    const b = backend();
    if (b === 'native'){ try{ await window.storage.delete(key, false); }catch(e){} return; }
    if (b === 'drive'){ await ensureDriveLoaded(); delete state.drive.store[key]; scheduleDriveUpload(); return; }
    try{ localStorage.removeItem('aventura:' + key); }catch(e){}
  }

  // ---------- Google Drive (appDataFolder) ----------
  function loadSavedClientId(){
    try{ return localStorage.getItem('aventura:googleClientId') || ''; }catch(e){ return ''; }
  }
  function saveClientId(id){
    try{ localStorage.setItem('aventura:googleClientId', id); }catch(e){}
  }

  async function driveFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + state.drive.token }, opts.headers || {});
    const res = await fetch(url, opts);
    if (res.status === 401){
      state.drive.signedIn = false;
      state.drive.loaded = false;
      updateStatus('Sua sessão do Google expirou — clique em "Entrar com Google" de novo nas Configurações.', true);
      render();
      throw new Error('Sessão do Google expirada.');
    }
    return res;
  }

  async function driveFindFile(){
    const q = encodeURIComponent("name='aventura-store.json'");
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name)');
    if (!res.ok) throw new Error('Falha ao procurar dados no Drive (' + res.status + ')');
    const data = await res.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }

  async function driveCreateFile(initialContent){
    const boundary = 'aventura_boundary_' + uid();
    const metadata = { name: 'aventura-store.json', parents: ['appDataFolder'] };
    const body =
      '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(initialContent) + '\r\n' +
      '--' + boundary + '--';
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) throw new Error('Falha ao criar dados no Drive (' + res.status + ')');
    const data = await res.json();
    return data.id;
  }

  async function driveReadFile(fileId){
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    if (!res.ok) throw new Error('Falha ao ler dados do Drive (' + res.status + ')');
    const text = await res.text();
    try{ return text ? JSON.parse(text) : {}; }catch(e){ return {}; }
  }

  async function driveWriteFile(fileId, content){
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method:'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(content)
    });
    if (!res.ok) throw new Error('Falha ao salvar no Drive (' + res.status + ')');
  }

  let driveLoadingPromise = null;
  async function ensureDriveLoaded(){
    if (state.drive.loaded) return;
    if (driveLoadingPromise) return driveLoadingPromise;
    driveLoadingPromise = (async () => {
      let fileId = await driveFindFile();
      if (!fileId){
        fileId = await driveCreateFile({});
        state.drive.store = {};
      } else {
        state.drive.store = await driveReadFile(fileId);
      }
      state.drive.fileId = fileId;
      state.drive.loaded = true;
    })();
    try{ await driveLoadingPromise; } finally { driveLoadingPromise = null; }
  }

  let driveUploadTimer = null;
  function scheduleDriveUpload(){
    clearTimeout(driveUploadTimer);
    driveUploadTimer = setTimeout(async () => {
      try{ await driveWriteFile(state.drive.fileId, state.drive.store); }
      catch(e){ console.error('drive upload failed', e); showSaveWarning(); }
    }, 500);
  }

  function initGoogleTokenClient(){
    if (!state.drive.clientId || typeof google === 'undefined' || !google.accounts) return;
    state.drive.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.drive.clientId,
      scope: 'https://www.googleapis.com/auth/drive.appdata',
      callback: async (resp) => {
        if (resp.error){
          if (!state.drive.signedIn) return; // falha numa tentativa silenciosa — não incomoda o usuário
          updateStatus('Erro ao entrar com Google: ' + resp.error, true); render(); return;
        }
        state.drive.token = resp.access_token;
        state.drive.tokenExpiry = Date.now() + (resp.expires_in || 3500) * 1000;
        state.drive.signedIn = true;
        state.drive.loaded = false;
        try{ localStorage.setItem('aventura:driveWasSignedIn', '1'); }catch(e){}
        updateStatus('Conectando ao Google Drive…', false);
        render();
        try{
          await ensureDriveLoaded();
          await init();
          updateStatus('Conectado ao Google Drive ✓ — os dados agora sincronizam por essa conta.', false);
        }catch(err){
          updateStatus('Erro ao carregar dados do Drive: ' + err.message, true);
        }
        render();
      }
    });
  }

  function signInWithGoogle(){
    const idInput = document.getElementById('googleClientId');
    const clientId = (idInput ? idInput.value.trim() : state.drive.clientId);
    if (!clientId){ updateStatus('Cole o Client ID do Google antes de entrar.', true); render(); return; }
    state.drive.clientId = clientId;
    saveClientId(clientId);
    if (!state.drive.tokenClient) initGoogleTokenClient();
    if (state.drive.tokenClient) state.drive.tokenClient.requestAccessToken();
    else updateStatus('A biblioteca do Google ainda não carregou — espera um segundo e tenta de novo.', true);
    render();
  }

  async function signOutGoogle(){
    state.drive.signedIn = false;
    state.drive.token = null;
    state.drive.loaded = false;
    state.drive.store = {};
    try{ localStorage.removeItem('aventura:driveWasSignedIn'); }catch(e){}
    await init();
    render();
  }

  // tenta reconectar sozinho, sem popup, se essa conta já entrou antes nesse navegador
  function attemptSilentGoogleSignIn(){
    let wasSignedIn = false;
    try{ wasSignedIn = localStorage.getItem('aventura:driveWasSignedIn') === '1'; }catch(e){}
    if (!wasSignedIn || !state.drive.clientId) return;
    let tries = 0;
    const poll = setInterval(() => {
      tries++;
      if (typeof google !== 'undefined' && google.accounts){
        clearInterval(poll);
        initGoogleTokenClient();
        if (state.drive.tokenClient){
          try{ state.drive.tokenClient.requestAccessToken({ prompt: '' }); }catch(e){}
        }
      } else if (tries > 20){
        clearInterval(poll);
      }
    }, 250);
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  // ---------- state ----------
  let state = {
    index: [],           // [{id,title,updatedAt}]
    story: null,          // current loaded story object
    connector: null,       // global default connector settings
    drive: {
      clientId: loadSavedClientId(),
      tokenClient: null,
      token: null,
      tokenExpiry: 0,
      signedIn: false,
      fileId: null,
      store: {},
      loaded: false
    },
    ui: {
      modal: null,         // null | 'settings' | 'stories'
      generating: false,
      statusMsg: '',
      statusErr: false,
      composerText: '',
      collapsed: new Set(),   // chaves tipo 'char:ID', 'loc:ID', 'group:ID'
      memoryPanelOpen: false,
      lastDebug: null,
      forcedLayout: (function(){ try{ return localStorage.getItem('aventura:forcedLayout') || 'auto'; }catch(e){ return 'auto'; } })()
    }
  };

  function defaultConnector(){
    return {
      mode: 'horde',            // 'horde' | 'openai' | 'builtin'
      hordeKey: '0000000000',
      hordeNsfw: true,
      hordeModels: '',
      oaEndpoint: '',
      oaKey: '',
      oaModel: '',
      maxLength: 220,
      temperature: 0.85,
      contextTurns: 14,
      debugMode: false
    };
  }

  function newStory(title){
    return {
      id: uid(),
      title: title || 'Nova aventura',
      pov: 'first',              // 'first' | 'second'
      memory: {
        persona: '',
        world: '',
        authorNote: '',
        summary: '',
        characters: [],   // {id, name, age, appearance, personality, desc, knows, origin, relations, isProtagonist}
        locations: [],    // {id, name, origin, desc, notes}
        groups: [],       // {id, name, members, dynamic}
        secrets: ''
      },
      turns: [],                  // {id, type:'user'|'ai', text, archived}
      connector: null,            // per-story override; null = use global
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
  }

  // ---------- init ----------
  async function init(){
    state.index = (await sGet('stories:index')) || [];
    state.connector = Object.assign(defaultConnector(), (await sGet('settings:connector')) || {});
    const lastId = await sGet('settings:lastOpen');
    if (lastId && state.index.find(s => s.id === lastId)){
      await loadStory(lastId);
    } else if (state.index.length){
      await loadStory(state.index[0].id);
    } else {
      const s = newStory('Minha primeira aventura');
      state.story = s;
      state.index.unshift({id:s.id, title:s.title, updatedAt:s.updatedAt});
      await sSet('story:' + s.id, s);
      await sSet('stories:index', state.index);
      await sSet('settings:lastOpen', s.id);
    }
    render();
  }

  function normalizeStory(s){
    if (!s.memory) s.memory = {};
    if (!s.memory.characters) s.memory.characters = [];
    if (!s.memory.locations) s.memory.locations = [];
    if (!s.memory.groups) s.memory.groups = [];
    if (typeof s.memory.secrets !== 'string') s.memory.secrets = '';
    if (typeof s.memory.persona !== 'string') s.memory.persona = '';
    if (typeof s.memory.world !== 'string') s.memory.world = '';
    if (typeof s.memory.authorNote !== 'string') s.memory.authorNote = '';
    if (typeof s.memory.summary !== 'string') s.memory.summary = '';
    // completa campos novos em fichas antigas
    s.memory.characters.forEach(c => {
      if (typeof c.age !== 'string') c.age = '';
      if (typeof c.appearance !== 'string') c.appearance = '';
      if (typeof c.personality !== 'string') c.personality = '';
      if (typeof c.isProtagonist !== 'boolean') c.isProtagonist = false;
      if (typeof c.desc !== 'string') c.desc = '';
      if (typeof c.knows !== 'string') c.knows = '';
      if (typeof c.origin !== 'string') c.origin = '';
      if (typeof c.relations !== 'string') c.relations = '';
    });
    s.memory.locations.forEach(l => {
      if (typeof l.origin !== 'string') l.origin = '';
      if (typeof l.desc !== 'string') l.desc = '';
      if (typeof l.notes !== 'string') l.notes = '';
    });
    s.memory.groups.forEach(g => {
      if (typeof g.members !== 'string') g.members = '';
      if (typeof g.dynamic !== 'string') g.dynamic = '';
    });
    // migra o antigo campo "persona" livre pra uma ficha de protagonista, uma única vez
    if (!s.migratedPersona && s.memory.persona && !s.memory.characters.some(c => c.isProtagonist)){
      s.memory.characters.unshift({
        id: uid(), name:'Protagonista', age:'', appearance:'', personality:'',
        desc: s.memory.persona, knows:'', isProtagonist:true
      });
    }
    s.migratedPersona = true;
    return s;
  }

  async function loadStory(id){
    const s = await sGet('story:' + id);
    if (s){ state.story = normalizeStory(s); await sSet('settings:lastOpen', id); }
    render();
  }

  let saveTimer = null;
  let saveIndicatorTimer = null;
  function scheduleSave(){
    if (!state.story) return;
    state.story.updatedAt = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const ok = await sSet('story:' + state.story.id, state.story);
      const idx = state.index.find(x => x.id === state.story.id);
      if (idx){ idx.title = state.story.title; idx.updatedAt = state.story.updatedAt; }
      const ok2 = await sSet('stories:index', state.index);
      if (!ok || !ok2){
        showSaveWarning();
      }
    }, 350);
  }

  function showSaveWarning(){
    state.ui.saveWarning = true;
    render();
    clearTimeout(saveIndicatorTimer);
    saveIndicatorTimer = setTimeout(() => {
      state.ui.saveWarning = false;
      render();
    }, 6000);
  }

  // ---------- connector logic ----------
  function activeConnector(){
    return (state.story && state.story.connector) ? state.story.connector : state.connector;
  }

  function buildCharactersBlock(characters){
    if (!characters || !characters.length) return '';
    const lines = characters.map(c => {
      const tag = c.isProtagonist ? '[PROTAGONISTA] ' : '';
      const bits = [tag + (c.name || 'Sem nome')];
      if (c.origin) bits.push('origem: ' + c.origin);
      if (c.age) bits.push('idade: ' + c.age);
      if (c.appearance) bits.push('aparência: ' + c.appearance);
      if (c.personality) bits.push('personalidade: ' + c.personality);
      if (c.relations) bits.push('relações/família: ' + c.relations);
      if (c.desc) bits.push('histórico/papel: ' + c.desc);
      if (c.knows) bits.push('sabe até agora: ' + c.knows);
      return '- ' + bits.join(' | ');
    });
    return 'FICHAS DE PERSONAGENS (respeite estritamente origem, aparência, personalidade, relações e o que cada um sabe — vale até para o protagonista; em crossovers, não misture regras/poderes de universos diferentes a menos que a história explique isso):\n' + lines.join('\n');
  }

  function buildLocationsBlock(locations){
    if (!locations || !locations.length) return '';
    const lines = locations.map(l => {
      const bits = [l.name || 'Sem nome'];
      if (l.origin) bits.push('origem: ' + l.origin);
      if (l.desc) bits.push('descrição: ' + l.desc);
      if (l.notes) bits.push('detalhes importantes: ' + l.notes);
      return '- ' + bits.join(' | ');
    });
    return 'LOCAIS (mantenha a geografia e detalhes consistentes):\n' + lines.join('\n');
  }

  function buildGroupsBlock(groups){
    if (!groups || !groups.length) return '';
    const lines = groups.map(g => {
      const bits = [g.name || 'Sem nome'];
      if (g.members) bits.push('membros: ' + g.members);
      if (g.dynamic) bits.push('dinâmica/relação entre eles: ' + g.dynamic);
      return '- ' + bits.join(' | ');
    });
    return 'GRUPOS / DINÂMICA FAMILIAR (respeite como esses personagens se tratam e se relacionam entre si):\n' + lines.join('\n');
  }

  function buildPromptMessages(actionText, opts){
    opts = opts || {};
    const s = state.story;
    const povLine = 'Narre em primeira pessoa E NO TEMPO PRESENTE, como se estivesse acontecendo agora, em tempo real (ex: "eu ando", "eu paro", "eu vejo" — nunca "eu andei", "eu parei", "eu vi"). É uma narração contínua, não um relato do passado.';
    const sys = [
      'Você é o narrador de uma aventura interativa contínua, no estilo de um jogo de RPG textual.',
      povLine,
      'Continue a história de forma coerente com tudo que já aconteceu. Escreva cenas vívidas mas não excessivamente longas (1 a 3 parágrafos). Termine a cena em um momento de tensão ou decisão em aberto, sem fazer perguntas diretas tipo "o que você faz agora" — apenas pare no ponto certo pra próxima ação encaixar naturalmente.',
      s.memory.persona ? ('Persona/personagem principal: ' + s.memory.persona) : '',
      s.memory.world ? ('Mundo/cenário: ' + s.memory.world) : '',
      s.memory.summary ? ('Resumo do que já aconteceu antes: ' + s.memory.summary) : '',
      buildCharactersBlock(s.memory.characters),
      buildLocationsBlock(s.memory.locations),
      buildGroupsBlock(s.memory.groups),
      s.memory.secrets ? (
        'SEGREDOS DO MUNDO (conhecimento do narrador, NÃO do protagonista): ' + s.memory.secrets +
        '\nRegra importante: nenhum personagem deve demonstrar saber dessas informações antes de descobri-las de fato na história. Não as revele na narração até que a trama naturalmente leve a essa descoberta.'
      ) : '',
      'Regra geral de conhecimento: cada personagem só sabe o que está descrito na ficha dele, mais o que já foi mostrado nas cenas anteriores. Nunca faça um personagem (incluindo o protagonista) reagir a uma informação que ele não teve como obter ainda.',
      s.memory.authorNote ? ('Notas do autor (siga sempre): ' + s.memory.authorNote) : '',
      opts.guidance ? ('INSTRUÇÃO ESPECÍFICA só pra esta próxima cena (siga à risca): ' + opts.guidance) : '',
      'LEMBRETE FINAL: continue exatamente de onde a história parou, reagindo diretamente à última ação do protagonista. Primeira pessoa, tempo presente. Não repita nem resuma o que já aconteceu — apenas continue.'
    ].filter(Boolean).join('\n\n');

    const conn = activeConnector();
    let liveTurns = s.turns.filter(t => !t.archived);
    if (opts.excludeTurnId) liveTurns = liveTurns.filter(t => t.id !== opts.excludeTurnId);
    liveTurns = liveTurns.slice(-1 * (conn.contextTurns || 14));
    const messages = [{role:'system', content: sys}];
    liveTurns.forEach(t => {
      messages.push({ role: t.type === 'user' ? 'user' : 'assistant', content: t.text });
    });
    if (opts.isContinue){
      messages.push({role:'user', content: '(Continue a cena naturalmente a partir daqui, sem introduzir uma nova ação explícita do protagonista — apenas dê continuidade ao que já está acontecendo.)', isContinueMarker:true});
    } else {
      messages.push({role:'user', content: actionText});
    }
    return {messages, sys, liveTurns};
  }

  function recordDebug(provider, request, response, error){
    const c = state.connector;
    if (!c.debugMode) return;
    state.ui.lastDebug = {
      provider, time: new Date().toLocaleTimeString('pt-BR'),
      request, response: response || null, error: error ? String(error) : null
    };
  }

  function stripEcho(promptTail, text){
    if (!text) return text;
    let t = text.trim();
    const tail = (promptTail || '').trim().slice(-80);
    if (tail && t.startsWith(tail)) t = t.slice(tail.length).trim();
    // remove common leaked markers some models add
    t = t.replace(/^(###|>>>|AI:|Narrador:)\s*/i, '').trim();
    return t;
  }

  async function callOpenAICompatible(messages){
    const c = activeConnector();
    if (!c.oaEndpoint) throw new Error('Configure o endpoint da API nas Configurações.');
    const headers = {'Content-Type':'application/json'};
    if (c.oaKey) headers['Authorization'] = 'Bearer ' + c.oaKey;
    const reqBody = {
      model: c.oaModel || undefined,
      messages,
      max_tokens: c.maxLength,
      temperature: c.temperature
    };
    let res, data;
    try{
      res = await fetch(c.oaEndpoint, { method:'POST', headers, body: JSON.stringify(reqBody) });
    }catch(err){
      recordDebug('openai', reqBody, null, err.message + ' (provavelmente CORS bloqueado pelo navegador — o provedor precisa permitir chamadas de outro site)');
      throw new Error('Falha de rede/CORS ao chamar a API. Veja o modo de depuração nas Configurações.');
    }
    if (!res.ok){
      const t = await res.text().catch(()=> '');
      recordDebug('openai', reqBody, t);
      throw new Error('API respondeu ' + res.status + ': ' + t.slice(0,200));
    }
    data = await res.json();
    recordDebug('openai', reqBody, data);
    const choice = data.choices && data.choices[0];
    const text = choice && (choice.message ? choice.message.content : choice.text);
    if (!text) throw new Error('Resposta da API veio sem texto (veja o modo de depuração).');
    return { text: text.trim(), meta: data.usage ? ('~' + data.usage.total_tokens + ' tokens') : null, usage: data.usage || null };
  }

  async function callAiHorde(messages){
    const c = activeConnector();
    const sys = messages.find(m => m.role === 'system');
    const history = messages.filter(m => m.role !== 'system' && !m.isContinueMarker);
    const storyBody = history.map(m => m.role === 'user' ? ('> ' + m.content) : m.content).join('\n\n');
    const promptText = (sys ? sys.content + '\n\n---\n\n' : '') + storyBody + '\n\n';

    const body = {
      prompt: promptText,
      params: {
        n: 1,
        max_context_length: 2048,
        max_length: c.maxLength,
        temperature: c.temperature,
        rep_pen: 1.1,
        top_p: 0.92
      },
      nsfw: !!c.hordeNsfw,
      trusted_workers: false
    };
    if (c.hordeModels){
      body.models = c.hordeModels.split(',').map(s=>s.trim()).filter(Boolean);
    }

    let submitRes;
    try{
      submitRes = await fetch('https://aihorde.net/api/v2/generate/text/async', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'apikey': c.hordeKey || '0000000000'},
        body: JSON.stringify(body)
      });
    }catch(err){
      recordDebug('horde-submit', body, null, err.message);
      throw new Error('Falha de rede ao contatar o AI Horde.');
    }
    if (!submitRes.ok){
      const t = await submitRes.text().catch(()=> '');
      recordDebug('horde-submit', body, t);
      throw new Error('AI Horde recusou o pedido (' + submitRes.status + '): ' + t.slice(0,200));
    }
    const submitData = await submitRes.json();
    recordDebug('horde-submit', body, submitData);
    const jobId = submitData.id;
    if (!jobId) throw new Error('AI Horde não retornou um id de geração (veja o modo de depuração).');

    const started = Date.now();
    while (Date.now() - started < 150000){
      await new Promise(r => setTimeout(r, 3000));
      updateStatus('Na fila do AI Horde… isso pode levar um tempinho, é uma rede comunitária gratuita.', false);
      const statusRes = await fetch('https://aihorde.net/api/v2/generate/text/status/' + jobId);
      if (!statusRes.ok) continue;
      const statusData = await statusRes.json();
      recordDebug('horde-status', {jobId}, statusData);
      if (statusData.done && statusData.generations && statusData.generations.length){
        const raw = statusData.generations[0].text || '';
        const clean = stripEcho(promptText, raw);
        if (!clean){
          throw new Error('O worker devolveu uma resposta vazia depois de remover o eco do prompt (veja o modo de depuração).');
        }
        return { text: clean, meta: submitData.kudos != null ? (submitData.kudos + ' kudos') : null, kudos: submitData.kudos };
      }
      if (statusData.faulted){
        throw new Error('A geração falhou no AI Horde. Tente novamente.');
      }
    }
    throw new Error('Tempo esgotado esperando o AI Horde. Tente novamente em instantes.');
  }

  async function callBuiltinClaude(messages){
    const sys = messages.find(m => m.role === 'system');
    const rest = messages.filter(m => m.role !== 'system').map(m => ({
      role: m.role === 'assistant' ? 'assistant' : 'user',
      content: m.content
    }));
    const reqBody = {
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: sys ? sys.content : undefined,
      messages: rest
    };
    let res, data;
    try{
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(reqBody)
      });
    }catch(err){
      recordDebug('builtin', reqBody, null, err.message);
      throw new Error('Falha de rede ao contatar a API embutida.');
    }
    if (!res.ok){
      const t = await res.text().catch(()=> '');
      recordDebug('builtin', reqBody, t);
      throw new Error('API embutida respondeu ' + res.status + ': ' + t.slice(0,200));
    }
    data = await res.json();
    recordDebug('builtin', reqBody, data);
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if (!textBlock) throw new Error('Resposta veio sem texto (veja o modo de depuração).');
    return { text: textBlock.text.trim(), meta: null };
  }

  async function generate(actionText, opts){
    const {messages} = buildPromptMessages(actionText, opts);
    const conn = activeConnector();
    let result;
    if (conn.mode === 'horde') result = await callAiHorde(messages);
    else if (conn.mode === 'builtin') result = await callBuiltinClaude(messages);
    else result = await callOpenAICompatible(messages);
    if (result.meta){
      state.story.stats = state.story.stats || {totalTokens:0, totalKudos:0};
      if (result.usage) state.story.stats.totalTokens += (result.usage.total_tokens || 0);
      if (result.kudos) state.story.stats.totalKudos += result.kudos;
    }
    return result;
  }

  // ---------- turn actions ----------
  function updateStatus(msg, isErr){
    state.ui.statusMsg = msg; state.ui.statusErr = !!isErr; render();
  }

  // ---------- desfazer / refazer (undo/redo) ----------
  function pushUndo(label){
    if (!state.ui.undoStack) state.ui.undoStack = [];
    state.ui.undoStack.push({ label, turns: JSON.parse(JSON.stringify(state.story.turns)) });
    if (state.ui.undoStack.length > 20) state.ui.undoStack.shift();
    state.ui.redoStack = []; // qualquer ação nova invalida o "refazer"
  }
  function undoLast(){
    const stack = state.ui.undoStack;
    if (!stack || !stack.length) return;
    if (!state.ui.redoStack) state.ui.redoStack = [];
    state.ui.redoStack.push({ label: stack[stack.length-1].label, turns: JSON.parse(JSON.stringify(state.story.turns)) });
    const prev = stack.pop();
    state.story.turns = prev.turns;
    scheduleSave();
    updateStatus('Desfeito: ' + prev.label, false);
    render();
  }
  function redoLast(){
    const stack = state.ui.redoStack;
    if (!stack || !stack.length) return;
    if (!state.ui.undoStack) state.ui.undoStack = [];
    state.ui.undoStack.push({ label: stack[stack.length-1].label, turns: JSON.parse(JSON.stringify(state.story.turns)) });
    const next = stack.pop();
    state.story.turns = next.turns;
    scheduleSave();
    updateStatus('Refeito: ' + next.label, false);
    render();
  }

  async function sendAction(){
    const text = state.ui.composerText.trim();
    if (!text || state.ui.generating) return;
    const s = state.story;
    s.turns.push({id: uid(), type:'user', text});
    state.ui.composerText = '';
    state.ui.generating = true;
    updateStatus('Escrevendo a próxima cena…', false);
    render();
    try{
      const result = await generate(text);
      s.turns.push({id: uid(), type:'ai', text: result.text, sourceAction: text, alts: [result.text], altIndex: 0});
      updateStatus(result.meta ? ('Gerado ✓  ' + result.meta) : '', false);
    }catch(err){
      updateStatus('Erro: ' + err.message, true);
    }
    state.ui.generating = false;
    scheduleSave();
    render();
    setTimeout(() => {
      const feed = document.querySelector('.feed');
      if (feed) feed.scrollTop = feed.scrollHeight;
    }, 30);
  }

  async function continueStory(){
    if (state.ui.generating) return;
    const s = state.story;
    state.ui.generating = true;
    updateStatus('Continuando a cena…', false);
    render();
    try{
      const result = await generate('', {isContinue:true});
      s.turns.push({id: uid(), type:'ai', text: result.text, sourceAction:'', isContinue:true, alts:[result.text], altIndex:0});
      updateStatus(result.meta ? ('Gerado ✓  ' + result.meta) : '', false);
      scheduleSave();
    }catch(err){
      updateStatus('Erro: ' + err.message, true);
    }
    state.ui.generating = false;
    render();
    setTimeout(() => {
      const feed = document.querySelector('.feed');
      if (feed) feed.scrollTop = feed.scrollHeight;
    }, 30);
  }

  function lastAiTurn(){
    const s = state.story;
    for (let i = s.turns.length - 1; i >= 0; i--){
      if (s.turns[i].type === 'ai') return s.turns[i];
    }
    return null;
  }

  async function retryLast(guidance){
    const s = state.story;
    if (state.ui.generating) return;
    const t = lastAiTurn();
    if (!t) return;
    pushUndo('retry');
    state.ui.generating = true;
    updateStatus('Gerando uma tentativa nova…', false);
    render();
    try{
      const opts = {excludeTurnId: t.id};
      if (guidance) opts.guidance = guidance;
      if (t.isContinue) opts.isContinue = true;
      const result = await generate(t.sourceAction || '', opts);
      if (!t.alts) t.alts = [t.text];
      t.alts.push(result.text);
      t.altIndex = t.alts.length - 1;
      t.text = result.text;
      updateStatus(result.meta ? ('Nova tentativa ✓  ' + result.meta) : '', false);
    }catch(err){
      updateStatus('Erro: ' + err.message, true);
    }
    state.ui.generating = false;
    state.ui.retryGuidanceOpen = false;
    state.ui.retryGuidanceText = '';
    scheduleSave();
    render();
  }

  function cycleAlt(turnId, dir){
    const t = state.story.turns.find(t => t.id === turnId);
    if (!t || !t.alts || t.alts.length < 2) return;
    t.altIndex = Math.max(0, Math.min(t.alts.length - 1, (t.altIndex || 0) + dir));
    t.text = t.alts[t.altIndex];
    scheduleSave();
    render();
  }

  function eraseLast(){
    const s = state.story;
    if (!s.turns.length) return;
    pushUndo('erase');
    s.turns.pop();
    scheduleSave();
    updateStatus('Último trecho apagado — dá pra desfazer se quiser.', false);
    render();
  }

  function rewindTo(turnId){
    const s = state.story;
    const idx = s.turns.findIndex(t => t.id === turnId);
    if (idx === -1) return;
    pushUndo('voltar no tempo');
    s.turns = s.turns.slice(0, idx + 1);
    scheduleSave();
    updateStatus('Voltou pro ponto #' + (idx + 1) + ' — dá pra desfazer se quiser.', false);
    render();
  }

  let editingTurnId = null;
  function startEdit(id){ editingTurnId = id; render(); }
  function cancelEdit(){ editingTurnId = null; render(); }
  function saveEdit(id, val){
    pushUndo('edição de trecho');
    const t = state.story.turns.find(t => t.id === id);
    if (t) t.text = val;
    editingTurnId = null;
    scheduleSave();
    updateStatus('Edição salva — dá pra desfazer se quiser.', false);
    render();
  }
  function deleteTurn(id){
    const s = state.story;
    pushUndo('apagar trecho');
    s.turns = s.turns.filter(t => t.id !== id);
    scheduleSave();
    updateStatus('Trecho apagado — dá pra desfazer se quiser.', false);
    render();
  }

  // ---------- auto memory summarization ----------
  async function summarizeOldTurns(){
    const s = state.story;
    const live = s.turns.filter(t => !t.archived);
    const chunk = live.slice(0, Math.max(0, live.length - 6)); // deixa as últimas 6 falas de fora
    if (chunk.length < 2){
      updateStatus('Ainda não há trechos antigos suficientes pra resumir.', true);
      render();
      return;
    }
    state.ui.generating = true;
    updateStatus('Resumindo o início da história…', false);
    render();
    try{
      const text = chunk.map(t => (t.type === 'user' ? 'Ação: ' : 'Narração: ') + t.text).join('\n');
      const messages = [
        {role:'system', content:'Resuma a passagem de história a seguir em no máximo 4 frases, mantendo nomes, lugares e decisões importantes. Responda só com o resumo.'},
        {role:'user', content: text}
      ];
      const conn = activeConnector();
      let result;
      if (conn.mode === 'horde') result = await callAiHorde(messages);
      else if (conn.mode === 'builtin') result = await callBuiltinClaude(messages);
      else result = await callOpenAICompatible(messages);
      s.memory.summary = (s.memory.summary ? s.memory.summary + ' ' : '') + result.text.trim();
      chunk.forEach(t => { t.archived = true; });
      updateStatus('Início da história resumido e arquivado.', false);
    }catch(err){
      updateStatus('Erro ao resumir: ' + err.message, true);
    }
    state.ui.generating = false;
    scheduleSave();
    render();
  }

  // ---------- generic card list management (personagens / locais / grupos) ----------
  function cardCollection(type){
    if (type === 'char') return state.story.memory.characters;
    if (type === 'loc') return state.story.memory.locations;
    if (type === 'group') return state.story.memory.groups;
  }
  function blankCard(type){
    if (type === 'char') return {id: uid(), name:'', age:'', appearance:'', personality:'', desc:'', knows:'', origin:'', relations:'', isProtagonist:false};
    if (type === 'loc') return {id: uid(), name:'', origin:'', desc:'', notes:''};
    if (type === 'group') return {id: uid(), name:'', members:'', dynamic:''};
  }
  function addCard(type){
    cardCollection(type).push(blankCard(type));
    scheduleSave();
    render();
  }
  function duplicateCard(type, id){
    const list = cardCollection(type);
    const c = list.find(c => c.id === id);
    if (!c) return;
    const copy = Object.assign({}, c, {id: uid(), name: c.name ? c.name + ' (cópia)' : ''});
    if (type === 'char') copy.isProtagonist = false;
    const idx = list.findIndex(c => c.id === id);
    list.splice(idx + 1, 0, copy);
    scheduleSave();
    render();
  }
  function removeCard(type, id){
    const list = cardCollection(type);
    if (type === 'char') state.story.memory.characters = list.filter(c => c.id !== id);
    if (type === 'loc') state.story.memory.locations = list.filter(c => c.id !== id);
    if (type === 'group') state.story.memory.groups = list.filter(c => c.id !== id);
    scheduleSave();
    render();
  }
  function updateCard(type, id, field, value){
    const list = cardCollection(type);
    const c = list.find(c => c.id === id);
    if (!c) return;
    c[field] = value;
    if (type === 'char' && field === 'isProtagonist' && value === true){
      list.forEach(other => { if (other.id !== id) other.isProtagonist = false; });
    }
    scheduleSave();
  }
  function toggleCollapsed(key){
    const set = state.ui.collapsed;
    if (set.has(key)) set.delete(key); else set.add(key);
    render();
  }
  function isCollapsed(key){ return state.ui.collapsed.has(key); }

  // aliases pra manter o restante do código estável
  const addCharacter = () => addCard('char');
  const duplicateCharacter = (id) => duplicateCard('char', id);
  const removeCharacter = (id) => removeCard('char', id);
  const updateCharacter = (id, field, value) => updateCard('char', id, field, value);


  // ---------- story management ----------
  async function createStory(){
    const title = window.prompt('Nome da nova aventura:', 'Nova aventura');
    if (title === null) return;
    const s = newStory(title || 'Nova aventura');
    state.index.unshift({id:s.id, title:s.title, updatedAt:s.updatedAt});
    state.story = s;
    await sSet('story:' + s.id, s);
    await sSet('stories:index', state.index);
    await sSet('settings:lastOpen', s.id);
    state.ui.modal = null;
    render();
  }

  async function deleteStory(id){
    const ok = window.confirm('Apagar esta aventura pra sempre? Não dá pra desfazer.');
    if (!ok) return;
    await sDelete('story:' + id);
    state.index = state.index.filter(s => s.id !== id);
    await sSet('stories:index', state.index);
    if (state.story && state.story.id === id){
      if (state.index.length) await loadStory(state.index[0].id);
      else {
        const s = newStory('Nova aventura');
        state.story = s;
        state.index.unshift({id:s.id, title:s.title, updatedAt:s.updatedAt});
        await sSet('story:' + s.id, s);
        await sSet('stories:index', state.index);
      }
    }
    render();
  }

  function exportStory(){
    const blob = new Blob([JSON.stringify(state.story, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (state.story.title || 'aventura').replace(/[^a-z0-9]/gi,'_') + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importStory(file){
    const reader = new FileReader();
    reader.onload = async (e) => {
      try{
        const s = normalizeStory(JSON.parse(e.target.result));
        s.id = uid(); // avoid collisions
        s.updatedAt = Date.now();
        state.index.unshift({id:s.id, title:s.title || 'Importada', updatedAt:s.updatedAt});
        state.story = s;
        await sSet('story:' + s.id, s);
        await sSet('stories:index', state.index);
        await sSet('settings:lastOpen', s.id);
        state.ui.modal = null;
        render();
      }catch(err){
        alert('Arquivo inválido.');
      }
    };
    reader.readAsText(file);
  }

            Nem sempre estão online (a rede é voluntária), mas vale tentar preencher esse campo.
            <br><br>Chave anônima funciona, mas tem prioridade mais baixa (fila mais longa). Registre-se de graça em
            <a href="https://aihorde.net/register" target="_blank" rel="noopener">aihorde.net/register</a> pra pegar uma chave com prioridade melhor.
            <br><br>Se aparecer "falha de rede", é porque o Claude.ai bloqueia chamadas a domínios externos de dentro do preview do app —
            baixe o arquivo .html e abra ele diretamente no seu navegador (fora do Claude.ai) pra essa opção funcionar.
          </div>
        ` : ''}
        ${c.mode === 'openai' ? `
          <div class="field">
            <label>Endpoint (URL completa de chat/completions)</label>
            <input type="text" id="oaEndpoint" value="${esc(c.oaEndpoint)}" placeholder="https://openrouter.ai/api/v1/chat/completions">
          </div>
          <div class="field">
            <label>Chave de API</label>
            <input type="text" id="oaKey" value="${esc(c.oaKey)}" placeholder="sk-...">
          </div>
          <div class="field">
            <label>Nome do modelo</label>
            <input type="text" id="oaModel" value="${esc(c.oaModel)}" placeholder="ex: meta-llama/llama-3.1-70b-instruct">
          </div>
          <div class="helpbox">
            Funciona com qualquer serviço que fale o formato de "chat completions" da OpenAI: OpenRouter (tem opções gratuitas),
            Ollama local (endpoint tipo http://localhost:11434/v1/chat/completions), text-generation-webui, etc.
            <br><br>Mesma observação: se der "falha de rede", abra o arquivo .html baixado direto no navegador, fora do Claude.ai.
          </div>
        ` : ''}

        <div class="divider"></div>
        <div class="row2">
          <div class="field">
            <label>Tamanho máx. da resposta (tokens)</label>
            <input type="text" id="maxLength" value="${c.maxLength}">
          </div>
          <div class="field">
            <label>Temperatura (0–2)</label>
            <input type="text" id="temperature" value="${c.temperature}">
          </div>
        </div>
        <div class="field">
          <label>Turnos de contexto enviados a cada mensagem</label>
          <input type="text" id="contextTurns" value="${c.contextTurns}">
        </div>
        <div class="field">
          <label><input type="checkbox" id="debugMode" ${c.debugMode?'checked':''}> Modo de depuração (mostra a resposta crua da API)</label>
        </div>
        ${c.debugMode && state.ui.lastDebug ? `
          <div class="helpbox mono" style="max-height:220px; overflow:auto; white-space:pre-wrap;">
            <strong>[${state.ui.lastDebug.time}] ${esc(state.ui.lastDebug.provider)}</strong><br>
            ${state.ui.lastDebug.error ? ('ERRO: ' + esc(state.ui.lastDebug.error)) : ''}
            RESPOSTA: ${esc(JSON.stringify(state.ui.lastDebug.response).slice(0, 1500))}
          </div>
        ` : ''}

        <div class="divider"></div>
        <h2>Sincronização (Google Drive)</h2>
        ${state.drive.signedIn ? `
          <div class="helpbox">Conectado ✓ — seus dados sincronizam automaticamente por essa conta Google, em qualquer aparelho onde você entrar.</div>
          <button class="danger" id="btnGoogleSignOut" style="width:100%;">Sair da conta Google</button>
        ` : `
          <div class="field">
            <label>Google OAuth Client ID</label>
            <input type="text" id="googleClientId" value="${esc(state.drive.clientId || '')}" placeholder="xxxxx.apps.googleusercontent.com">
          </div>
          <button class="primary" id="btnGoogleSignIn" style="width:100%;">Entrar com Google</button>
          <div class="helpbox">
            Precisa de um Client ID configurado uma vez (grátis) no Google Cloud Console. E essa página precisa estar aberta
            num endereço https:// (ou http://localhost) — abrir o arquivo direto com duplo clique não funciona com login do Google.
            Pede pro Claude o passo a passo se ainda não configurou.
          </div>
        `}

        <button class="primary" id="saveSettings" style="width:100%;margin-top:6px;">Salvar configurações</button>
      </div>
    </div>`;
  }

  function renderStoriesModal(){
    return `
    <div class="modal-overlay" id="overlayStories">
      <div class="modal">
        <button class="close icon ghost" id="closeStories">✕</button>
        <h2>Minhas aventuras</h2>
        ${state.index.map(s => `
          <div class="story-item">
            <div class="info">
              <div class="t">${esc(s.title)}</div>
              <div class="d">atualizado em ${new Date(s.updatedAt).toLocaleString('pt-BR')}</div>
            </div>
            <button data-open="${s.id}">abrir</button>
            <button class="danger" data-delstory="${s.id}">apagar</button>
          </div>
        `).join('') || '<p style="color:var(--muted)">Nenhuma aventura ainda.</p>'}
        <div class="divider"></div>
        <div style="display:flex; gap:8px;">
          <button class="primary" id="btnCreateStory" style="flex:1;">＋ Nova aventura</button>
          <button id="btnExportStory">Exportar atual (.json)</button>
          <label class="button" style="display:inline-flex;align-items:center;">
            <button id="btnImportTrigger">Importar</button>
            <input type="file" id="importInput" accept=".json" style="display:none;">
          </label>
        </div>
      </div>
    </div>`;
  }

  function bindEvents(){
    const $ = sel => document.querySelector(sel);
    const $$ = sel => document.querySelectorAll(sel);

    const titleField = $('#titleField');
    if (titleField) titleField.addEventListener('blur', e => {
      state.story.title = e.target.textContent.trim() || 'Sem título';
      scheduleSave();
    });

    const btnStories = $('#btnStories'); if (btnStories) btnStories.onclick = () => { state.ui.modal = 'stories'; render(); };
    const btnSettings = $('#btnSettings'); if (btnSettings) btnSettings.onclick = () => { state.ui.modal = 'settings'; render(); };
    const btnMemory = $('#btnMemory'); if (btnMemory) btnMemory.onclick = () => { state.ui.memoryPanelOpen = true; render(); };
    const btnCloseMemory = $('#btnCloseMemory'); if (btnCloseMemory) btnCloseMemory.onclick = () => { state.ui.memoryPanelOpen = false; render(); };
    const memoryBackdrop = $('#memoryBackdrop'); if (memoryBackdrop) memoryBackdrop.onclick = () => { state.ui.memoryPanelOpen = false; render(); };
    const btnNew = $('#btnNew'); if (btnNew) btnNew.onclick = createStory;
    const btnLayoutToggle = $('#btnLayoutToggle');
    if (btnLayoutToggle) btnLayoutToggle.onclick = () => {
      const order = ['auto', 'mobile', 'desktop'];
      const next = order[(order.indexOf(state.ui.forcedLayout) + 1) % order.length];
      state.ui.forcedLayout = next;
      try{ localStorage.setItem('aventura:forcedLayout', next); }catch(e){}
      render();
    };

    const bind = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };
    bind('#memWorld','input', e => { state.story.memory.world = e.target.value; scheduleSave(); });
    bind('#memNote','input', e => { state.story.memory.authorNote = e.target.value; scheduleSave(); });
    bind('#memSummary','input', e => { state.story.memory.summary = e.target.value; scheduleSave(); });
    bind('#memSecrets','input', e => { state.story.memory.secrets = e.target.value; scheduleSave(); });
    bind('#btnSummarize','click', summarizeOldTurns);
    $$('[data-addtype]').forEach(b => b.onclick = () => addCard(b.dataset.addtype));
    $$('[data-cdel]').forEach(b => b.onclick = () => { const [t,id] = b.dataset.cdel.split(':'); removeCard(t,id); });
    $$('[data-cdup]').forEach(b => b.onclick = () => { const [t,id] = b.dataset.cdup.split(':'); duplicateCard(t,id); });
    $$('[data-ctoggle]').forEach(b => b.onclick = () => toggleCollapsed(b.dataset.ctoggle));
    $$('[data-secttoggle]').forEach(h => h.onclick = () => toggleCollapsed('sect:' + h.dataset.secttoggle));
    $$('[data-cfield]').forEach(inp => inp.addEventListener('input', e => {
      updateCard(e.target.dataset.ctype, e.target.dataset.cid, e.target.dataset.cfield, e.target.value);
    }));
    $$('[data-cprotag]').forEach(chk => chk.addEventListener('change', e => {
      updateCard('char', e.target.dataset.cprotag, 'isProtagonist', e.target.checked);
      render();
    }));

    bind('#composer','input', e => { state.ui.composerText = e.target.value; });
    bind('#composer','keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); sendAction(); }
    });
    bind('#btnSend','click', sendAction);
    bind('#btnContinue','click', continueStory);
    bind('#btnRetry','click', () => retryLast());
    bind('#btnUndo','click', undoLast);
    bind('#btnRedo','click', redoLast);
    bind('#btnErase','click', eraseLast);
    bind('#btnRetryOptions','click', () => { state.ui.retryGuidanceOpen = !state.ui.retryGuidanceOpen; render(); });
    bind('#btnRetryGo','click', () => {
      const input = document.getElementById('retryGuidanceInput');
      const guidance = input ? input.value.trim() : '';
      state.ui.retryGuidanceText = guidance;
      retryLast(guidance || undefined);
    });
    bind('#btnRetryCancel','click', () => { state.ui.retryGuidanceOpen = false; render(); });
    $$('[data-altnav]').forEach(b => b.onclick = () => {
      const [turnId, dir] = b.dataset.altnav.split(':');
      cycleAlt(turnId, parseInt(dir));
    });

    $$('.spine .tab').forEach(t => t.onclick = () => rewindTo(t.dataset.jump));
    $$('[data-edit]').forEach(b => b.onclick = () => startEdit(b.dataset.edit));
    $$('[data-cancel]').forEach(b => b.onclick = cancelEdit);
    $$('[data-save]').forEach(b => b.onclick = () => {
      const box = document.querySelector('[data-editbox="'+b.dataset.save+'"]');
      saveEdit(b.dataset.save, box.value);
    });
    $$('[data-rewind]').forEach(b => b.onclick = () => rewindTo(b.dataset.rewind));
    $$('[data-del]').forEach(b => b.onclick = () => deleteTurn(b.dataset.del));

    // settings modal
    bind('#closeSettings','click', () => { state.ui.modal = null; render(); });
    bind('#overlaySettings','click', (e) => { if (e.target.id === 'overlaySettings'){ state.ui.modal = null; render(); } });
    bind('#connMode','change', e => { state.connector.mode = e.target.value; render(); state.ui.modal = 'settings'; });
    bind('#btnGoogleSignIn','click', signInWithGoogle);
    bind('#btnGoogleSignOut','click', signOutGoogle);
    bind('#saveSettings','click', async () => {
      const c = state.connector;
      const g = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
      if (c.mode === 'horde'){
        c.hordeKey = g('hordeKey') || '0000000000';
        c.hordeNsfw = !!document.getElementById('hordeNsfw').checked;
        c.hordeModels = g('hordeModels') || '';
      } else if (c.mode === 'openai'){
        c.oaEndpoint = g('oaEndpoint') || '';
        c.oaKey = g('oaKey') || '';
        c.oaModel = g('oaModel') || '';
      }
      c.maxLength = parseInt(g('maxLength')) || 220;
      c.temperature = parseFloat(g('temperature')) || 0.85;
      c.contextTurns = parseInt(g('contextTurns')) || 14;
      c.debugMode = !!document.getElementById('debugMode').checked;
      await sSet('settings:connector', c);
      state.ui.modal = null;
      updateStatus('Configurações salvas.', false);
      render();
    });

    // stories modal
    bind('#closeStories','click', () => { state.ui.modal = null; render(); });
    bind('#overlayStories','click', (e) => { if (e.target.id === 'overlayStories'){ state.ui.modal = null; render(); } });
    bind('#btnCreateStory','click', createStory);
    bind('#btnExportStory','click', exportStory);
    bind('#btnImportTrigger','click', () => document.getElementById('importInput').click());
    bind('#importInput','change', e => { if (e.target.files[0]) importStory(e.target.files[0]); });
    $$('[data-open]').forEach(b => b.onclick = () => { loadStory(b.dataset.open); state.ui.modal = null; });
    $$('[data-delstory]').forEach(b => b.onclick = () => deleteStory(b.dataset.delstory));
  }

  init();
  attemptSilentGoogleSignIn();
})();
</script>
</body>
</html>
